function confetti(){if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;$('#confetti')?.remove();let el=document.createElement('div');el.id='confetti';el.className='confetti';el.setAttribute('aria-hidden','true');el.innerHTML=Array.from({length:48},(_,i)=>`<i style="--x:${(i*37)%100}%;--delay:${i%9*.07}s;--rot:${i*27}deg"></i>`).join('');document.body.append(el);schedule(()=>el.remove(),3400);}

function footer(){return `<footer class="footer"><span>${CONFIG.credit.enabled?esc(CONFIG.credit.text):''}</span><span>${esc(CONFIG.copy.footerTagline)} <a href="#host">Host Studio ${icon('arrow',10)}</a></span></footer>`;}
function heroStage(){return `<div class="hero-stage" aria-label="An original velvet-curtain stage with three ribbon-wrapped gifts"><div class="spotlight"></div><div class="arch"><div class="bulbs"></div></div>${ornament()}${ornament()}<div class="stage-sign"><span class="eyebrow">${esc(state.party.group)}</span><h2>${esc(CONFIG.copy.stageTitle[0])}<br><em>${esc(CONFIG.copy.stageTitle[1])}</em><br>${esc(CONFIG.copy.stageTitle[2])}</h2><div class="tiny-star">✦ &nbsp; ✦ &nbsp; ✦</div><span class="eyebrow">${esc(state.party.name)}</span></div><div class="stage-gifts"><div class="display-gift">${giftArt(1,true)}</div><div class="display-gift">${giftArt(2,true)}</div><div class="display-gift">${giftArt(3,true)}</div></div><div class="stage-floor"></div></div>`;}
function welcomeView(){return `<main><div class="hero"><div class="hero-copy"><div class="hero-kicker"><span class="eyebrow">HOSTED BY ${esc(state.party.host)}</span></div><h1>GOOD GIFTS.<br>GREAT <em>STEALS.</em><br>YOUR SHOW.</h1><p class="intro">${esc(CONFIG.copy.welcomeIntro)}</p><div class="actions"><button class="primary" data-act="go-host">Enter Host Studio ${icon('arrow',18)}</button><button class="ghost" data-act="tour">${icon('play',16)} Take the 75s tour</button></div><div class="micro">No accounts. No downloads inside the app. Just bring one wrapped gift.</div>${state.phase!=='setup'?`<p style="margin-top:16px"><a href="#board">Resume your saved show ${icon('arrow',14)}</a></p>`:''}</div>${heroStage()}</div><div class="content" style="padding-top:0;padding-bottom:15px"><div class="party-strip"><div><small>THE CALL TIME</small><strong>${esc(state.party.date)} · ${esc(state.party.time)}</strong></div><div><small>THE STAGE</small><strong>${esc(state.party.place)}</strong></div><div><small>THE GIFT LIMIT</small><strong>${esc(state.party.budget)} · one wrapped gift each</strong></div><div><small>THE CAST</small><strong>${state.players.filter(p=>!p.removed).length} staff · ${state.players.filter(p=>p.remote&&!p.removed).length} joining by video</strong></div></div><div class="below"><article><span class="num">01 /</span><h3>DRAW YOUR SPOTLIGHT</h3><p>A ticket drum sets the order. Your turn, your choice: a mystery parcel or a tempting steal.</p></article><article><span class="num">02 /</span><h3>A LITTLE FRIENDLY DRAMA</h3><p>Big reveals, bold steals and gifts that lock in. Every rule is checked, so you can enjoy the show.</p></article><article><span class="num">03 /</span><h3>EVERYONE LEAVES A WINNER</h3><p>One gift each, a grand finale and a keepsake recap. Even the colleague on the video call.</p></article></div></div></main>`;}
function ruleLines(){const r=state.rules;return state.rulesPreset==='Kind'?['Bring one wrapped gift within the '+state.party.budget+' limit.','Unwrap in ticket order. No stealing during the draw.','At the end, each player may suggest one swap.','A swap happens only when both players accept.','No pressure: keeping your gift is always welcome.']:[`Bring one wrapped gift within the ${state.party.budget} limit.`,`On your turn, unwrap a new gift or steal an opened, unlocked gift.`,`A stolen-from player immediately takes the next move. Unwrapping ends the chain.`,`A gift locks in after ${r.freezeAfter} steal${r.freezeAfter===1?'':'s'}; locked gifts never move.`,r.noImmediateStealBack?'You cannot take the same gift straight back.':'Immediate steal-back is allowed by this preset.',!r.allowStealFromThief?'You may not steal from the person who just stole from you.':'You may steal from the person who just stole from you (subject to the steal-back rule).',r.chainLimit<100?`At most ${r.chainLimit} steals per chain, then unwrap.`:'A chain may continue until someone unwraps.',r.finalSwap?'Player 1 gets one final swap with another unlocked gift.':'There is no final swap.',r.timerSeconds?`${r.timerSeconds} seconds per move. ${r.autoAdvance?'At zero, the next numbered unopened gift is automatically revealed.':'At zero, the host decides; no automatic move.'}`:'Take your time: the turn timer is off.'];}
function playerRows(){return state.players.filter(p=>!p.removed).map(p=>{const g=gift(state,p.giftId)||state.gifts.find(g=>g.by===p.id);return `<div class="player-row">${avatar(p)}<div><span class="person-name">${esc(p.name)} ${p.remote?'↗':''}</span><span class="person-role">${esc(p.role)}${p.late&&!p.here?' · arriving later':''}</span></div><span class="taglabel">${p.here?'Gift #'+g?.no:'Tag pending'}</span><div class="row-actions"><button class="checkin ${p.here?'here':''}" data-act="${p.here?'player-edit':'checkin'}" data-id="${esc(p.id)}" aria-label="${p.here?'Edit':'Check in'} ${esc(p.name)}">${p.here?icon('check',12)+' Here':'+ Here'}</button><button class="small ghost" data-act="remove" data-id="${esc(p.id)}" aria-label="Remove ${esc(p.name)}">×</button></div></div>`;}).join('');}
function rulesControls(){let r=state.rules;return `<div class="preset-cards">${Object.keys(PRESETS).map(k=>`<button class="preset-card ${state.rulesPreset===k?'selected':''}" data-act="preset" data-id="${k}" ${state.phase!=='setup'?'disabled':''}><strong>${k}</strong><small>${esc(presetSummary[k])}</small></button>`).join('')}</div><form id="rules-form"><div class="form-grid"><label class="field"><span>Steals before a gift locks</span><input name="freezeAfter" type="number" min="1" max="20" value="${r.freezeAfter}" required></label><label class="field"><span>Maximum steals per chain</span><input name="chainLimit" type="number" min="1" max="100" value="${r.chainLimit}" required></label><label class="field"><span>Timer seconds (0 = off)</span><input name="timerSeconds" type="number" min="0" max="600" value="${r.timerSeconds}" required></label><label class="field"><span>Preset</span><input value="${esc(state.rulesPreset)}" readonly></label></div><label class="checkfield"><input type="checkbox" name="noImmediateStealBack" ${r.noImmediateStealBack?'checked':''}>No immediate steal-back of the same gift</label><label class="checkfield"><input type="checkbox" name="allowStealFromThief" ${r.allowStealFromThief?'checked':''}>Allow stealing from the person who just stole from you</label><label class="checkfield"><input type="checkbox" name="finalSwap" ${r.finalSwap?'checked':''}>Player 1 gets one final swap</label><label class="checkfield"><input type="checkbox" name="autoAdvance" ${r.autoAdvance?'checked':''}>Timer expiry automatically unwraps the next gift</label><p class="micro">Kind always ends with mutually accepted swaps. 100 steals per chain acts as the Classic safety cap.</p><button class="primary wide" type="submit" ${state.phase!=='setup'?'disabled':''}>Save adjusted rules</button></form>${state.phase!=='setup'?'<p class="help-note">Rules are locked after the ticket draw. Your selected rules stay fair for the whole show.</p>':''}`;}
function studioView(){const count=participants(state).length;return `<main class="content"><div class="page-head"><div><span class="eyebrow">BACKSTAGE / THE HOST STUDIO</span><h1>SET THE SCENE.</h1><p>A few taps here. A whole show out there.</p></div><div class="actions"><span class="pill">${count} here · ${state.players.filter(p=>!p.here&&!p.removed).length} expected</span><button class="primary" data-act="${['setup','draw'].includes(state.phase)?'go-draw':'go-board'}">${['setup','draw'].includes(state.phase)?'Draw the turn order':'Back to the show'} ${icon('arrow',17)}</button></div></div>${loadError?`<div class="notice">${esc(loadError)} <button class="small" data-act="damaged">Download the damaged save</button></div>`:''}<div class="studio-layout"><section class="panel"><div class="studio-tabs" role="tablist" aria-label="Studio sections"><button data-act="studio-tab" data-id="players" role="tab" aria-selected="${studioTab==='players'}" class="${studioTab==='players'?'selected':''}">The players <span class="micro">${state.players.filter(p=>!p.removed).length}</span></button><button data-act="studio-tab" data-id="gifts" role="tab" aria-selected="${studioTab==='gifts'}" class="${studioTab==='gifts'?'selected':''}">The gifts</button><button data-act="studio-tab" data-id="rules" role="tab" aria-selected="${studioTab==='rules'}" class="${studioTab==='rules'?'selected':''}">The rules</button></div>${studioTab==='players'?`<div class="panel-head"><div><span class="eyebrow">BAKERS, BARISTAS & FRONT COUNTER</span><h2>THE CAST OF CHARACTERS</h2></div><button class="small" data-act="add-player">+ Add</button></div><div class="help-note">Tap <strong>Here</strong> as each person arrives. Their gift tag number is assigned automatically. ${esc(castNote())}</div>${playerRows()}<p class="micro" style="margin:17px 0 0">Here = checked in. Tap a checked-in badge to edit a name or emoji. A late check-in joins the end of the turn order.</p>`:studioTab==='gifts'?`<div class="panel-head"><div><span class="eyebrow">THE MYSTERIES / HOST ONLY</span><h2>WRAPPED & READY</h2></div></div><div class="help-note">Descriptions and contributors stay backstage until the reveal or recap. Upload a photo for the remote gift; images are resized and saved inside your backup.</div><div style="margin-top:18px">${state.gifts.filter(g=>!g.withdrawn).map(g=>`<div class="gift-edit-row">${giftArt(g.no||14)}<div><h3>${g.no?'#'+g.no:'Pending tag'} · ${esc(g.label||'Mystery gift')}${g.reserve?' · reserve':''}</h3><p>${esc(player(state,g.by)?.name||'Anonymous')} ${g.photo?'· image added':''}</p></div><button class="small" data-act="gift-edit" data-id="${esc(g.id)}">Edit</button></div>`).join('')}</div>`:rulesControls()}</section><aside><section class="panel"><div class="panel-head"><div><span class="eyebrow">TONIGHT’S HOUSE RULES</span><h2>${esc(state.rulesPreset.toUpperCase())} ${icon('star',18)}</h2></div><button class="small ghost" data-act="studio-tab" data-id="rules">Adjust</button></div><ol class="rule-list">${ruleLines().map(t=>`<li>${esc(t)}</li>`).join('')}</ol></section><section class="panel"><div class="panel-head"><div><span class="eyebrow">CHOOSE YOUR STAGE</span><h2>DRESS THE SHOW</h2></div></div>${styleOptions()}<p class="micro" style="margin:15px 0 0">Same party. A different kind of sparkle.</p></section><section class="panel"><span class="eyebrow">THE HOST’S TOOLKIT</span><div class="actions" style="margin:15px 0;gap:7px"><button class="small" data-act="tv">${icon('tv',16)} Open TV window</button><button class="small" data-act="video">${videoLayout?'✓ ':''}Video-call layout</button><button class="small" data-act="export">Export backup</button><button class="small" data-act="import">Import backup</button></div><div class="help-note">Everything stays on this device. For a phone host, open the app on that phone and mirror its TV window through the same browser/device. Independent phones cannot sync without a server.</div><button class="small ghost danger wide" style="margin-top:15px" data-act="new">Start a new game</button></section></aside></div></main>`;}
function styleOptions(){return `<div class="style-options">${CONFIG.styles.map(s=>`<button class="style-choice ${state.style===s?'selected':''}" data-act="style" data-id="${esc(s)}" aria-pressed="${state.style===s}"><span class="style-swatch" aria-hidden="true"></span>${esc(s)}</button>`).join('')}</div>`;}
function drawView(){return `<main class="content draw-screen"><span class="eyebrow">EVERY STAR GETS A NUMBER</span><h1>ROLL THE TICKET DRUM.</h1><p class="muted">One ticket. One turn. A little luck of the draw.</p><div class="draw-stage"><div class="spotlight"></div><div class="drum ${drawBusy?'spinning':''}"><span class="drum-ticket">07</span><span class="drum-ticket">12</span><span class="drum-ticket">03</span></div></div>${state.order.length?`<span class="eyebrow">YOUR RUNNING ORDER · ${state.order.length} PLAYERS</span><div class="ticket-grid">${state.order.map((id,i)=>`<div class="ticket" style="animation-delay:${Math.min(i*.14,1.8)}s"><strong>${String(i+1).padStart(2,'0')}</strong><span>${esc(player(state,id)?.name)}</span></div>`).join('')}</div>`:'<p class="micro">${esc(castNote())} Late arrivals join the end of the order.</p>'}<div class="actions" style="justify-content:center"><button class="${state.order.length?'ghost':'primary'}" data-act="draw" ${drawBusy?'disabled':''}>${icon('gift',18)} ${state.order.length?'Redraw tickets':'Draw the tickets'}</button><button data-act="manual-order">We drew from a hat</button>${state.phase==='draw'?'<button class="primary" data-act="start">Lights up. Start the show '+icon('arrow',18)+'</button>':''}</div><p class="micro"><a href="#print">Print numbered tickets</a> for a real-life hat draw.</p></main>`;}
function currentId(){return state.phase==='final'?firstPlayer(state):state.phase==='kind'?state.order[state.kindCursor]:state.active;}
function remaining(){const t=state.timer;if(!t.startedAt)return Math.max(0,t.remaining);return Math.max(0,Math.ceil(t.remaining-(Date.now()-t.startedAt)/1000));}
function timerMarkup(){return `<div class="timer ${remaining()<=10&&state.timer.startedAt?'urgent':''}" aria-label="Turn timer"><strong id="timer-value">${(state.rules.timerSeconds||state.timer.remaining)?String(remaining()).padStart(2,'0'):'∞'}</strong><span id="timer-label">${state.paused?'PAUSED':state.timer.startedAt?'SECONDS':'TIMER'}</span></div>`;}
function giftCard(g){const owner=player(state,g.owner),actionType=state.phase==='final'?'FINAL_SWAP':g.opened?'STEAL':'UNWRAP',reason=moveReason(state,{type:actionType,gift:g.id});let showReason=selectMode&&((selectMode==='steal'&&g.opened)||(selectMode==='unwrap'&&!g.opened));
 const isIllegal=!!reason&&!!showReason;return `<button class="gift-card ${g.opened?'opened':''} ${g.frozen?'frozen':''} ${isIllegal?'illegal':''}" data-act="gift" data-id="${esc(g.id)}" aria-label="Gift ${g.no}, ${g.opened?esc(g.label)+', held by '+esc(owner?.name||'nobody'):'wrapped'}${g.frozen?', locked in':''}" ${isTV?'tabindex="-1"':''}><span class="gift-no">${g.opened?'#'+g.no:''}</span>${g.opened?(safePhoto(g.photo)?`<img class="photo" data-photo-id="${esc(g.id)}" alt="${esc(g.label)}">`:`<div class="gift-icon">${icon(g.frozen?'snow':'gift',28)}</div>`)+`<span class="gift-name">${esc(g.label)}</span><span class="owner">${esc(owner?.name.split(' ')[0]||'Awaiting owner')}</span><span class="pips" aria-label="${g.steals} of ${state.rules.freezeAfter} steals">${Array.from({length:Math.min(state.rules.freezeAfter,20)},(_,i)=>`<i class="pip ${i<g.steals?'filled':''}"></i>`).join('')}</span>${g.frozen?`<span class="locked">${icon('lock',12)} Locked in</span>`:''}`:giftArt(g.no)+`<span class="wrapped-name">A little mystery</span>`}${isIllegal?`<span class="reason">${esc(reason)}</span>`:''}</button>`;}
function sidePanel(){const id=currentId(),r=state.rules;return `<aside class="side-panel"><div><span class="eyebrow">THE SPOTLIGHT</span><h3>${state.chain?'THE PLOT THICKENS.':'MAKE A LITTLE MERRY.'}</h3>${state.chain?`<div class="chain-box">${esc(state.events.filter(e=>e.type==='STEAL').at(-1)?.text||'')}</div>`:`<p style="font-size:11px;color:var(--muted)">${state.rulesPreset==='Kind'?'A little kindness. A gift for everyone.':`Steal it. Love it. Lock it in after ${r.freezeAfter}.`}</p>`}<span class="pill">${esc(state.rulesPreset)} · ${state.chain} ${r.chainLimit<100?'/ '+r.chainLimit:''} in chain</span><div class="host-script">Say: “${esc(short(state,id))}, ${state.phase==='final'?'keep your gift or make your final swap':state.phase==='kind'?'would you like to suggest a swap':state.chain>=r.chainLimit?'unwrap a new gift':state.rulesPreset==='Kind'?'unwrap a new gift':'unwrap a new gift or steal one'}!”</div><div class="up-next"><h3 style="margin-top:22px">UP NEXT</h3>${state.order.slice(state.cursor+1,state.cursor+4).map((id,i)=>`<div class="next-turn"><span class="ticketnum">${String(state.cursor+i+2).padStart(2,'0')}</span><div><span class="person-name">${esc(player(state,id)?.name)}</span><span class="person-role">${player(state,id)?.remote?'Joining by video':'Waiting in the wings'}</span></div></div>`).join('')||'<p class="micro">The finale is getting closer.</p>'}</div></div><div><h3 style="margin-top:22px">JUST HAPPENED</h3><div class="recent">${state.events.filter(e=>['UNWRAP','STEAL','FIX','FINAL_SWAP','KIND_SWAP'].includes(e.type)).slice(-3).reverse().map(e=>`<div>${esc(e.text)}</div>`).join('')||'<div>The parcels are keeping their secrets. For now.</div>'}</div>${!isTV?'<button class="small ghost wide" style="margin-top:12px" data-act="history">Full move history '+icon('arrow',14)+'</button>':''}</div></aside>`;}
function boardView(){
 if(state.phase==='setup')return `<main class="content"><div class="empty-state">${icon('gift',48)}<h2>THE STAGE IS READY.<br>THE CAST IS UP TO YOU.</h2><p class="muted">Check in your crew and draw the tickets to start.</p><button class="primary" data-act="go-host">Enter Host Studio ${icon('arrow',17)}</button></div></main>`;
 if(state.phase==='draw')return drawView();if(state.phase==='done')return finalView();const id=currentId(),p=player(state,id),gs=eligible(state);return `<main class="board-wrap ${videoLayout?'video-layout':''}"><div class="board-title"><div><h1>${esc(state.party.name.toUpperCase())}</h1><small>${esc(state.party.group.toUpperCase())} &nbsp; / &nbsp; ${esc(state.party.host.toUpperCase())}</small></div><span class="pill onair">● ${state.paused?'INTERMISSION':state.phase==='final'?'THE FINAL CHOICE':state.phase==='kind'?'THE KINDNESS ROUND':'ON STAGE'} &nbsp; ${state.phase==='playing'?(state.cursor+1)+' / '+state.order.length:''}</span></div>${state.phase==='final'?`<div class="mode-banner"><span><strong>One final flourish.</strong> Player 1 may exchange their unlocked gift with one other unlocked gift. Then the curtain rises.</span><button class="primary small" data-act="pass">Keep my gift ${icon('check',14)}</button></div>`:state.phase==='kind'?`<div class="mode-banner"><span><strong>A little give and take.</strong> ${esc(p?.name)} may suggest one swap. Both people must agree.</span><button class="primary small" data-act="pass">Keep my gift</button></div>`:''}<div class="show-layout"><section class="board-main"><div class="spot-panel"><div><span class="eyebrow">${state.phase==='final'?'PLAYER 1 / THE LAST WORD':state.phase==='kind'?'OPTIONAL SWAP '+(state.kindCursor+1)+' / '+state.order.length:'TICKET '+String(player(state,state.order[state.cursor])?.ticketNumber||state.cursor+1).padStart(2,'0')+' / YOUR MOMENT'}</span><h2>${esc(p?.name||'Your next star')}${p?.remote?' ↗':''}</h2><p>${state.phase==='final'?'Keep your favourite. Or make one last move.':state.phase==='kind'?'A happy yes from both players, or keep what you love.':state.chain?'You were stolen from. The spotlight is yours.':'Unwrap a surprise. Or steal the show.'}</p></div>${timerMarkup()}</div><div class="gift-grid" aria-label="Gift board">${gs.map(giftCard).join('')}</div>${state.paused?'<div class="paused-overlay"><div><span class="eyebrow">REFILL YOUR CUP</span><h2>INTERMISSION.</h2><p>The gifts can wait a moment.</p><button class="primary no-print" data-act="pause">Resume the show</button></div></div>':''}</section>${sidePanel()}</div>${!isTV?`<div class="host-bar"><div class="host-main-actions">${state.phase==='playing'?`<button class="primary" data-act="unwrap">${icon('gift',17)} Unwrap <span class="key">U</span></button><button class="ruby" data-act="steal" ${state.rulesPreset==='Kind'?'disabled':''}>${icon('arrow',17)} Steal <span class="key">S</span></button>`:`<button class="primary" data-act="${state.phase==='kind'?'kind':'steal'}">Choose a swap ${icon('arrow',16)}</button>`}<button class="icon-btn" data-act="undo" aria-label="Undo last action" title="Undo (Z)" ${log.position?'':'disabled'}>${icon('undo',18)}</button><button class="icon-btn" data-act="redo" aria-label="Redo action" title="Redo" ${log.position<log.actions.length?'':'disabled'}>↻</button></div><span class="note">Tap a parcel to choose it.</span><div class="host-extra"><button class="small" data-act="pause">${icon('pause',13)} ${state.paused?'Resume':'Pause'}</button><button class="small" data-act="timer">${icon('clock',13)} Timer</button><button class="small" data-act="tv">${icon('tv',14)} TV</button><button class="small" data-act="more">••• More</button></div></div>`:''}<div class="board-legend"><span>${icon('lock',10)} Locked gifts never move. Contributor names stay secret until the recap.</span><span>${state.rules.noImmediateStealBack?'No immediate steal-back':''}</span></div></main>`;}
function awards(){const gs=eligible(state),max=Math.max(0,...gs.map(g=>g.steals)),wanted=gs.filter(g=>g.steals===max).sort((a,b)=>a.no-b.no),top=Math.max(0,...Object.values(state.stealScores)),leaders=state.players.filter(p=>state.stealScores[p.id]===top),first=gift(state,state.firstOpened);return [{title:'MOST WANTED',value:max?wanted.map(g=>g.label).join(', '):'Every gift found a fan',detail:max?`${max} steal${max===1?'':'s'}${wanted.length>1?' each · tied favourites':' · a crowd favourite'}`:'No steals tonight. All smiles.'},{title:'MASTER OF THE SWAP',value:top?leaders.map(p=>p.name).join(', '):'The whole crew',detail:top?`${top} steal${top===1?'':'s'}${leaders.length>1?' each · shared honours':' · beautifully played'}`:'A generous group effort'},{title:'FIRST IN THE SPOTLIGHT',value:first?.label||'The first surprise',detail:first?'Gift #'+first.no+' · where the story began':'The anticipation was half the fun'}];}

 if(printTab==='invite')body=`<div class="invitation"><span class="eyebrow">YOU’RE INVITED / APRONS OFF</span><h2>${esc(state.party.name.toUpperCase())}</h2><p>${esc(state.party.group)}</p><div class="invite-detail"><strong>${esc(state.party.date)}<br>${esc(state.party.time)}</strong><br>${esc(state.party.place)}<br><strong>One wrapped gift · ${esc(state.party.budget)} limit</strong></div><p>We’ll draw a turn order, unwrap a little joy${state.rulesPreset==='Kind'?' and finish with optional, agreed swaps.':', and enjoy a few friendly steals.'}</p><p style="font-size:11px">${esc(ruleSummary(state.rulesPreset,state.rules))}${state.players.some(p=>p.remote&&!p.removed)?'<br>'+esc(CONFIG.copy.remoteInviteNote):''}</p><span class="eyebrow">HOSTED BY ${esc(state.party.host)}</span></div>`;
