function itemSelection(){if(!activeSheet)return;let form=$('#itemForm'),size=form.querySelector('[name=size]:checked')?.value,options=[];for(const g of activeSheet.addons){const selected=[...form.querySelectorAll(`[name="addon-${CSS.escape(g.id)}"]:checked`)];if(selected.length<g.min||selected.length>g.max)throw Error(t('invalidOptions'));selected.forEach(el=>options.push({group:g.id,id:el.value}))}return{item:activeSheet.id,size,options,spice:Number($('#spice').value),qty:Number($('#itemQty').textContent),notes:$('#itemNotes').value}}
function unitPrice(b){const i=C.items.find(x=>x.id===b.item);if(!i)return 0;let p=priceOf(i)+cents(i.sizes.find(s=>s.id===b.size)?.price||'0.00');for(const o of b.options){let g=i.addons.find(g=>g.id===o.group),x=g?.options.find(x=>x.id===o.id);p+=cents(x?.price||'0.00')}return p}function updateItemTotal(){try{let b=itemSelection();$('#itemTotal').textContent=money(unitPrice(b)*b.qty);$('#itemError').textContent=''}catch(e){$('#itemError').textContent=e.message}}function persistBasket(){writeStore(LS+'-basket',basket);writeStore(LS+'-ref',ref);applyBrand()}
function basketTotal(){return basket.reduce((n,b)=>n+unitPrice(b)*b.qty,0)}function optionsText(b){const i=C.items.find(x=>x.id===b.item);if(!i)return'';return [value(i.sizes.find(s=>s.id===b.size)?.name),...b.options.map(o=>value(i.addons.find(g=>g.id===o.group)?.options.find(x=>x.id===o.id)?.name)),`${t('spice')} ${b.spice}/5`].filter(Boolean).join(', ')}
function openBasket(){activeSheet=null;modal(t('basket'),`<div class="sheet-content">${basket.length?basket.map((b,n)=>{let i=C.items.find(x=>x.id===b.item);if(!i)return'';return `<div class="basket-line"><div class="art">${svgArt(i)}</div><div><h3>${content(i.name)}</h3><p>${esc(optionsText(b))}</p>${b.notes?`<p>${esc(b.notes)}</p>`:''}${!available(i)?`<p class="error">${t('notNow')}</p>`:''}<div class="row wrap"><div class="quantity"><button data-bqty="${n}" data-delta="-1" aria-label="${t('reduce')}">−</button><b>${b.qty}</b><button data-bqty="${n}" data-delta="1" aria-label="${t('increase')}">+</button></div><button class="textbtn" data-edit-b="${n}">${t('edit')}</button><button class="textbtn" data-remove-b="${n}">${t('remove')}</button></div></div><bdi class="price">${esc(money(unitPrice(b)*b.qty))}</bdi></div>`}).join(''):`<p>${t('basketEmpty')}</p>`}<div class="row between"><h3>${t('subtotal')}</h3><bdi class="price">${esc(money(basketTotal()))}</bdi></div><p class="small">${content(C.taxNote)}</p><div class="rule"></div><div class="grid2"><button data-request="table" class="${requestType==='table'?'primary':''}">${t('tableService')}</button><button data-request="takeaway" class="${requestType==='takeaway'?'primary':''}">${t('takeaway')}</button></div><form id="orderForm">${requestType==='table'?`<label for="tableNumber">${t('table')}</label><select id="tableNumber" required><option value="">—</option>${C.tables.map(n=>`<option ${n===table?'selected':''} value="${n}">${t('table')} ${n}</option>`).join('')}</select>`:`<label for="guestName">${t('name')}</label><input id="guestName" required maxlength="80"><label for="pickup">${t('pickup')} · <bdi>${esc(C.timezone)}</bdi></label><input id="pickup" type="datetime-local" required>`}<label for="orderNotes">${t('notes')}</label><textarea id="orderNotes" maxlength="500" rows="2"></textarea><p class="confirmation">${t('confirmNote')}</p><p class="error" id="orderError" role="alert"></p></form></div>`,`<button class= function validWallRequest(v){if(!/^\d{4}-\d\d-\d\dT\d\d:\d\d$/.test(v))return false;let m=Date.parse(v+'Z')/60000;if(!Number.isFinite(m)||m<=wall()||!openAt(m))return false;let exists=false;for(let offset=-840;offset<=840;offset+=15){if(actualWall(new Date((m-offset)*60000))===m){exists=true;break}}return exists}
function composeOrder({type,table,name,pickup,notes},rows=basket){let lines=[C.identity.name,t(type==='table'?'tableService':'takeaway'),type==='table'?`${t('table')}: ${table}`:`${t('name')}: ${name}\n${t('pickup')}: ${pickup.replace('T',' ')} (${C.timezone})`, ''];for(const b of rows){let i=C.items.find(x=>x.id===b.item);lines.push(`${b.qty} × ${value(i.name)} (${optionsText(b)}) — ${money(unitPrice(b)*b.qty)}`);if(b.notes)lines.push(`  ${t('notes')}: ${b.notes}`)}lines.push('',`${t('total')}: ${money(rows.reduce((n,b)=>n+unitPrice(b)*b.qty,0))}`,value(C.taxNote));if(notes)lines.push(`${t('notes')}: ${notes}`);lines.push(`${t('reference')}: ${ref}`,t('confirmNote'));return lines.join('\n')}

function validateConfig(c){if(!c||!Array.isArray(c.items)||!Array.isArray(c.categories)||!c.identity?.name||!LANGS.every(l=>c.languages?.includes(l))||c.languages.length!==5||c.languages.some((l,n)=>l!==LANGS[n]))throw Error(t('invalidData'));new Intl.DateTimeFormat('en',{timeZone:c.timezone});new Intl.NumberFormat('en',{style:'currency',currency:c.currency});if(!/^[A-Z]{3}$/.test(c.currency))throw Error(t('invalidData'));if(!Array.isArray(c.tables)||c.tables.length>100||c.tables.some(n=>!Number.isInteger(n)||n<1||n>999)||new Set(c.tables).size!==c.tables.length)throw Error(t('invalidData'));if(!/^[a-f0-9]{64}$/.test(c.studio?.hash)||typeof c.studio?.salt!=='string')throw Error(t('invalidData'));
const ids=new Set(),catIds=new Set(c.categories.map(c=>c.id));if(catIds.size!==c.categories.length)throw Error(t('invalidData'));for(const cat of c.categories)if(!/^[\w-]{1,60}$/.test(cat.id)||!cat.name?.en)throw Error(t('invalidData'));for(const i of c.items){if(!/^[\w-]{1,60}$/.test(i.id)||ids.has(i.id)||!i.name?.en||!catIds.has(i.category)||!Array.isArray(i.tags)||!Array.isArray(i.periods)||!Array.isArray(i.badges)||!Number.isInteger(i.spice)||i.spice<0||i.spice>5)throw Error(t('invalidData'));ids.add(i.id);cents(i.price);if(!Array.isArray(i.sizes)||!i.sizes.length||!Array.isArray(i.addons))throw Error(t('invalidOptions'));const sids=new Set;for(const s of i.sizes){if(!/^[\w-]+$/.test(s.id)||sids.has(s.id)||!s.name?.en)throw Error(t('invalidOptions'));sids.add(s.id);cents(s.price)}const gids=new Set;for(const g of i.addons){if(!/^[\w-]+$/.test(g.id)||gids.has(g.id)||!g.name?.en||!Number.isInteger(g.min)||!Number.isInteger(g.max)||g.min<0||g.max<g.min||g.max>g.options.length)throw Error(t('invalidOptions'));gids.add(g.id);let oids=new Set;for(const o of g.options){if(!/^[\w-]+$/.test(o.id)||oids.has(o.id)||!o.name?.en)throw Error(t('invalidOptions'));oids.add(o.id);cents(o.price)}}if(!i.allergens||ALLERGENS.some(a=>!['Contains','May contain','Unknown'].includes(i.allergens[a])))throw Error(t('invalidAllergen'));if(i.photo&&!/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(i.photo))throw Error(t('photoInvalid'))}
const timeOK=s=>/^([01]\d|2[0-3]):[0-5]\d$/.test(s);for(let d=0;d<7;d++){if(!Array.isArray(c.hours[d]))throw Error(t('invalidData'));for(const p of c.hours[d])if(p.length!==2||!p.every(timeOK)||p[0]===p[1])throw Error(t('invalidData'))}if(!Array.isArray(c.holidays)||c.holidays.some(d=>!/^\d{4}-\d\d-\d\d$/.test(d)))throw Error(t('invalidData'));for(const p of c.menus)if(!p.id||!timeOK(p.start)||!timeOK(p.end))throw Error(t('invalidData'));for(const o of [...c.specials,...c.happyHour]){if(!ids.has(o.item)||!timeOK(o.start)||!timeOK(o.end)||!/^\d{4}-\d\d-\d\d$/.test(o.from)||!/^\d{4}-\d\d-\d\d$/.test(o.to)||o.from>o.to||!Array.isArray(o.weekdays)||o.weekdays.some(n=>n<0||n>6))throw Error(t('invalidData'));if(o.price)cents(o.price)}return c}

function collectEditor(){if(!$('#editName'))return editorItem;let i=editorItem;i.name[editorLang]=$('#editName').value;i.description[editorLang]=$('#editDesc').value;i.ingredients[editorLang]=$('#editIngredients').value;i.price=$('#editPrice').value;i.category=$('#editCategory').value;i.spice=Number($('#editSpice').value);i.soldOut=$('#editSold').checked;i.hidden=$('#editHidden').checked;i.tags=$$('[data-edit-tag]:checked').map(x=>x.dataset.editTag);i.badges=$$('[data-edit-badge]:checked').map(x=>x.dataset.editBadge);$$('[data-allergen]').forEach(x=>i.allergens[x.dataset.allergen]=x.value);i.sizes=JSON.parse($('#editSizes').value);i.addons=JSON.parse($('#editAddons').value);i.periods=JSON.parse($('#editPeriods').value);return i}

function drawLiveEditor(){const i=editorItem;if(!$('#liveEditorPreview'))return;let l=lang;lang=editorLang;$('#liveEditorPreview').innerHTML=`<div class="art" style="height:160px">${svgArt(i)}</div><h3>${content(i.name)}</h3><p>${content(i.description)}</p><span class="price">${/^\d+(\.\d{1,2})?$/.test(i.price)?esc(money(cents(i.price))):esc(i.price)}</span><div class="dish-tags">${diet(i)}</div>`;lang=l}
function csvParse(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],field='',quoted=false,line=1,startLine=1;for(let n=0;n<text.length;n++){let ch=text[n];if(quoted){if(ch==='"'&&text[n+1]==='"'){field+='"';n++}else if(ch==='"')quoted=false;else{field+=ch;if(ch==='\n')line++}}else if(ch==='"'&&field==='')quoted=true;else if(ch===','){row.push(field);field=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[n+1]==='\n')n++;row.push(field);if(row.some(x=>x.trim()))rows.push({fields:row,line:startLine});row=[];field='';line++;startLine=line}else field+=ch}if(quoted)throw Error(t('invalidData')+' · '+t('row')+' '+startLine);row.push(field);if(row.some(x=>x.trim()))rows.push({fields:row,line:startLine});return rows}
function parseImport(text){const rows=csvParse(text);if(!rows.length)throw Error(t('invalidCSV'));const headers=rows.shift().fields.map(x=>x.trim());if(!['id','category','name_en','description_en','price'].every(x=>headers.includes(x)))throw Error(t('invalidCSV'));let accepted=[],errors=[],seen=new Set;for(const [rowIndex,row] of rows.entries()){const r=Object.fromEntries(headers.map((x,i)=>[x,row.fields[i]||'']));try{if(!r.id||!r.name_en)throw Error(t('requiredName'));if(!/^[\w-]{1,60}$/.test(r.id)||seen.has(r.id)||!C.categories.some(c=>c.id===r.category))throw Error(t('invalidCategory'));cents(r.price);let i=clone(C.items.find(x=>x.id===r.id)||newDish());i.id=r.id;i.category=r.category;i.price=r.price;for(const l of LANGS){for(const f of ['name','description','ingredients'])if(headers.includes(f+'_'+l))i[f][l]=r[f+'_'+l]}if(headers.includes('tags'))i.tags=r.tags.split('|').filter(Boolean);if(headers.includes('badges'))i.badges=r.badges.split('|').filter(Boolean);if(headers.includes('sold_out'))i.soldOut=/^(true|1|yes)$/i.test(r.sold_out);for(const a of ALLERGENS){if(headers.includes('allergen_'+a)){if(!['Contains','May contain','Unknown'].includes(r['allergen_'+a]))throw Error(t('invalidAllergen'));i.allergens[a]=r['allergen_'+a]}}let candidate=clone(C);candidate.items=[i];candidate.specials=[];candidate.happyHour=[];validateConfig(candidate);seen.add(r.id);accepted.push(i)}catch(e){errors.push(`${t('row')} ${rowIndex+2}: ${e.message}`)}}return{accepted,errors}}
function showImport(text){csvImport=parseImport(text);$('#csvPreview').innerHTML=`<div class="rule"></div><h3>${t('preview')}</h3><p><b>${csvImport.accepted.length}</b> ${t('accepted')} · <b>${csvImport.errors.length}</b> ${t('errors')}</p>${csvImport.errors.map(e=>`<p class="error">${esc(e)}</p>`).join('')}<div style="max-height:260px;overflow:auto">${csvImport.accepted.map(i=>`<div class="hoursrow"><span>${esc(i.id)} · ${content(i.name)}</span><bdi>${esc(money(cents(i.price)))}</bdi></div>`).join('')}</div><label for="importMode">${t('import')}</label><select id="importMode"><option value="merge">${t('merge')}</option><option value="replace">${t('replace')}</option></select><button data-apply-import class="primary" ${csvImport.accepted.length?'':'disabled'}>${t('apply')}</button>`}
function sampleCSV(){const h=['id','category',...LANGS.flatMap(l=>['name_'+l,'description_'+l,'ingredients_'+l]),'price','tags','badges','sold_out',...ALLERGENS.map(a=>'allergen_'+a)];const quote=s=>'"'+String(s??'').replace(/"/g,'""')+'"';return'\uFEFF'+[h.map(quote).join(','),...C.items.map(i=>[i.id,i.category,...LANGS.flatMap(l=>[i.name[l],i.description[l],i.ingredients[l]]),i.price,i.tags.join('|'),i.badges.join('|'),i.soldOut,...ALLERGENS.map(a=>i.allergens[a])].map(quote).join(','))].join('\r\n')}

function startTour(){if(touring)stopTour();tourSnapshot={C:clone(C),basket:clone(basket),lang,unlocked,table,previewWall,history:clone(history),hash:location.hash};touring=true;previewWall=Date.UTC(2026,9,14,10,30)/60000;document.addEventListener('pointerdown',stopReal,true);document.addEventListener('keydown',stopReal,true);for(const [tourIndex,[seconds,caption,action]] of TOUR.entries())tourTimers.push(setTimeout(()=>{if(!touring)return;action();if(touring){$('#tourCaption').innerHTML=esc(t('tour'+tourIndex))+'<small>OLIVEWICK KITCHEN · '+String(seconds).padStart(2,'0')+' / 90 · '+esc(t('stopTour'))+'</small>';$('#tourCaption').hidden=false}},seconds*1000))}
function stopReal(e){if(e.isTrusted)stopTour()}function stopTour(){tourTimers.forEach(clearTimeout);tourTimers=[];if(!tourSnapshot)return;let s=tourSnapshot;C=s.C;basket=s.basket;lang=s.lang;unlocked=s.unlocked;table=s.table;previewWall=s.previewWall;history=s.history;filters.clear();category='';query='';touring=false;tourSnapshot=null;$('#tourCaption').hidden=true;document.removeEventListener('pointerdown',stopReal,true);document.removeEventListener('keydown',stopReal,true);closeModal();historyReplace(s.hash);guest();route()}

// Original local QR encoder: ISO QR Model 2, byte mode, version 5-L,
// 108 data codewords + 26 Reed–Solomon codewords, mask 0, four-module quiet zone.
// Maximum 106 UTF-8 bytes. Explicit length errors instead of broken QR output.
function qrMatrix(text){const bytes=[...new TextEncoder().encode(text)];if(bytes.length>106)throw Error(t('qrLong'));let bits=[];const put=(v,n)=>{for(let j=n-1;j>=0;j--)bits.push((v>>>j)&1)};put(4,4);put(bytes.length,8);bytes.forEach(b=>put(b,8));put(0,Math.min(4,864-bits.length));while(bits.length%8)bits.push(0);let data=[];for(let i=0;i<bits.length;i+=8)data.push(bits.slice(i,i+8).reduce((a,b)=>a*2+b,0));for(let pad=0;data.length<108;pad++)data.push(pad%2?17:236);
const mul=(a,b)=>{let r=0;for(let i=0;i<8;i++){if(b&1)r^=a;b>>>=1;a<<=1;if(a&256)a^=0x11d}return r};let generator=[1],alpha=1;for(let i=0;i<26;i++){let next=Array(generator.length+1).fill(0);generator.forEach((v,j)=>{next[j]^=v;next[j+1]^=mul(v,alpha)});generator=next;alpha=mul(alpha,2)}let remainder=Array(26).fill(0);for(const b of data){const f=b^remainder.shift();remainder.push(0);for(let j=0;j<26;j++)remainder[j]^=mul(generator[j+1],f)}const all=[...data,...remainder];let stream=[];all.forEach(b=>{for(let j=7;j>=0;j--)stream.push((b>>>j)&1)});
const n=37,m=Array.from({length:n},()=>Array(n).fill(false)),fn=Array.from({length:n},()=>Array(n).fill(false));const set=(x,y,v)=>{if(x>=0&&y>=0&&x<n&&y<n){m[y][x]=!!v;fn[y][x]=true}};const finder=(cx,cy)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){let z=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,z!==2&&z!==4)}};finder(3,3);finder(n-4,3);finder(3,n-4);for(let j=8;j<n-8;j++){set(6,j,j%2===0);set(j,6,j%2===0)}for(let y=-2;y<=2;y++)for(let x=-2;x<=2;x++)set(30+x,30+y,Math.max(Math.abs(x),Math.abs(y))!==1);
function format(){let v=8,r=v<<10;for(let i=14;i>=10;i--)if((r>>>i)&1)r^=0x537<<(i-10);let f=((v<<10)|r)^0x5412;let b=i=>((f>>>i)&1)!==0;for(let i=0;i<=5;i++)set(8,i,b(i));set(8,7,b(6));set(8,8,b(7));set(7,8,b(8));for(let i=9;i<15;i++)set(14-i,8,b(i));for(let i=0;i<8;i++)set(n-1-i,8,b(i));for(let i=8;i<15;i++)set(8,n-15+i,b(i));set(8,n-8,true)}format();let idx=0,up=true;for(let col=n-1;col>=1;col-=2){if(col===6)col--;for(let j=0;j<n;j++){let row=up?n-1-j:j;for(let dx=0;dx<2;dx++){let x=col-dx;if(!fn[row][x])m[row][x]=!!((stream[idx++]||0)^((row+x)%2===0?1:0))}}up=!up}format();return m}
function qrSVG(text){let m=qrMatrix(text),path='';for(let r=0;r<m.length;r++)for(let c=0;c<m.length;c++)if(m[r][c])path+=`M${c+4},${r+4}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 45 45" role="img" aria-label="QR" shape-rendering="crispEdges"><rect width="45" height="45" fill="white"/><path d="${path}" fill="#101510"/></svg>`}
function qrURL(tableNumber){if(!/^https:\/\//i.test(C.publicURL))throw Error(t('urlWarning'));let url=new URL(C.publicURL);if(url.username||url.password)throw Error(t('invalidData'));url.hash='';url.searchParams.delete('cover');url.searchParams.delete('tour');url.searchParams.delete('table');if(tableNumber)url.searchParams.set('table',tableNumber);return url.href}
function qrPNG(url,name){const svg=qrSVG(url),img=new Image();img.onload=()=>{let canvas=document.createElement('canvas');canvas.width=canvas.height=900;canvas.getContext('2d').drawImage(img,0,0,900,900);canvas.toBlob(blob=>download(name,blob,'image/png'))};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg)}
function printLayout(type){let html='',title=t('qr');if(type==='qr'){html=`<div class="qr-grid">${[0,...C.tables].map(n=>{let url=qrURL(n);return `<div class="qr-card">${qrSVG(url)}<h3>${n?t('table')+' '+n:t('counter')}</h3><p class="small">${esc(url)}</p><div class="row wrap noprint"><button data-svg="${n}">SVG</button><button data-png="${n}">PNG</button></div></div>`}).join('')}</div>`}if(type==='tents'){title=t('tents');html=C.tables.map(n=>`<div class="tent"><div class="row" style="justify-content:center">${mark()}<h3>${esc(C.identity.name)}</h3></div><h2>${t('table')} ${n}</h2><p>${t('scan')}</p>${qrSVG(qrURL(n))}<p class="small">${t('allergenNote')}</p><div class="fold"><small>${t('fold')}</small><h3>${esc(C.identity.name)}</h3><h2>${t('table')} ${n}</h2><p>${t('scan')}</p>${qrSVG(qrURL(n))}</div></div>`).join('')}if(type==='poster'){title=t('poster');html=`<div class="poster">${mark()}<h1>${esc(C.identity.name)}</h1><p>${content(C.identity.tagline)}</p>${qrSVG(qrURL(0))}<h2>${t('scan')}</h2><h3>${t('hours')}</h3>${Object.keys(C.hours).map(d=>`<div class="hoursrow"><span>${t('day'+d)}</span><bdi>${C.hours[d].map(x=>x.join(' – ')).join(' / ')||t('closed')}</bdi></div>`).join('')}<p class="small">${esc(C.timezone)} · ${t('confirmNote')}</p></div>`}if(type==='menu'){title=t('printMenu');html=`<h1 style="font-size:40px">${esc(C.identity.name)}</h1><p>${content(C.identity.tagline)}</p>${C.demo?`<p class="small">${t('demo')}</p>`:''}<div class="print-menu">${C.categories.filter(c=>!c.hidden).map(c=>`<h2 style="font-size:26px;margin:20px 0 8px">${content(c.name)}</h2>${visibleItems().filter(i=>i.category===c.id).map(i=>`<div class="print-dish"><div class="row between"><h3>${content(i.name)}</h3><bdi class="price">${esc(money(priceOf(i)))}</bdi></div><p>${content(i.description)}</p><div class="small">${diet(i)} ${i.soldOut?' · '+t('sold'):''}</div></div>`).join('')}`).join('')}</div><p class="small">${t('allergenNote')} · ${content(C.taxNote)}</p>`}modal(title,`<div c
