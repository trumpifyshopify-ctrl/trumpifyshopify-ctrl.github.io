<script id="calendar-config" type="application/json">{"id": "little-lantern-mila-jonah-2026", "mode": "Gift", "names": "Mila & Jonah", "senders": "Grandma & Grandpa", "startDate": "2026-12-01", "timeZone": "Europe/London", "numberOfDoors": 24, "style": "Cosy village", "sounds": true, "passphrase": "lantern-love", "credit": true, "brand": {"name": "Your lovely shop", "logo": "", "shopLink": "", "signupLink": ""}, "doors": [{"type": "message", "title": "A little light for you", "text": "Dear Mila and Jonah,\nEvery window on this snowy street holds a little piece of our love. Open one each day, and imagine us sitting beside you.\nWith the biggest hugs, Grandma & Grandpa"}, {"type": "riddle", "title": "A chilly little riddle", "text": "I wear a carrot, but never eat it. I have a scarf, but never feel cold. What am I?", "answer": "A snowman! Can you give yours a funny name?"}, {"type": "photo", "title": "Our imaginary snow day", "text": "Sample illustration • Replace this with a family photo in Maker Studio.", "photo": "sample:snow", "caption": "Mila and Jonah, let’s make a real snow-day memory together. Love, Grandpa."}, {"type": "game", "title": "Pairs by the fireside", "text": "Find the four matching pairs. Take turns: Mila first, then Jonah.", "game": "memory", "words": ["STAR", "MITTEN", "TREE", "CUP"]}, {"type": "message", "title": "Pocket-sized kindness", "text": "Today’s tiny mission: tell someone one lovely thing about them. Kind words are little lanterns.\nLove, Grandma"}, {"type": "coupon", "title": "One very cosy cocoa", "text": "This voucher is good for one hot chocolate made by Dad, with a marshmallow smile. Ask a grown-up to help.", "code": "COCOA-HUG", "caption": "One cosy cup each for Mila and Jonah."}, {"type": "joke", "title": "Grandpa’s snowy giggle", "text": "Why did the snowflake bring a suitcase?", "answer": "It was going on a flurry holiday! Now invent an even sillier answer."}, {"type": "recipe", "title": "Grandma’s little star biscuits", "text": "Make these with a grown-up. Makes about 16 small biscuits.", "ingredients": "125 g soft butter\n60 g caster sugar\n180 g plain flour\n1 teaspoon vanilla\nA pinch of cinnamon (optional)", "steps": "1. A grown-up heats the oven to 170°C (150°C fan).\n2. Mix butter and sugar, then stir in vanilla and flour.\n3. Roll to 5 mm thick and cut small stars.\n4. Bake on a lined tray for 12–15 minutes until pale gold.\n5. Cool completely. Share a star with someone you love.", "caption": "Contains wheat and dairy. A grown-up handles the oven and checks family allergies."}, {"type": "game", "title": "The lantern picture", "text": "Slide a tile next to the empty space to mend our little winter picture.", "game": "sliding", "photo": "sample:lantern"}, {"type": "activity", "title": "A village of your own", "text": "Print this original colouring page. Give each house a different colour, and draw someone waving in a window.", "activity": "village"}, {"type": "message", "title": "The blanket boat", "text": "Tonight, build a blanket boat on the sofa. Mila is captain; Jonah is the lookout. Your destination: the Island of Bedtime Stories.\nLove, Grandpa"}, {"type": "photo", "title": "A lantern for our favourite two", "text": "Sample illustration • A winter wish from Grandma and Grandpa.", "photo": "sample:lantern", "caption": "Even when we’re apart, you make our days brighter, Mila and Jonah."}, {"type": "game", "title": "Jumbled snow words", "text": "Tap letters in the right order. A grown-up can read the clue.", "game": "scramble", "words": ["SNOW", "STAR", "COCOA"]}, {"type": "riddle", "title": "The night-time visitor", "text": "I shine above the village. I am not a lamp. Sometimes I look like a slice of cake. What am I?", "answer": "The moon! Look out tonight and tell us its shape."}, {"type": "coupon", "title": "The bedtime book ticket", "text": "Choose an extra bedtime story with Grandma or Grandpa, in person or on a call.", "code": "STORY-TIME", "caption": "One extra story, with all the funny voices."}, {"type": "game", "title": "Our little winter quiz", "text": "Three questions. Guess together, and learn something lovely.", "game": "quiz", "questions": [{"q": "How many points does a real snow crystal usually have?", "answers": ["Six", "Three", "Eight"], "correct": 0, "fact": "Most snow crystals have six sides or points."}, {"q": "Which animal keeps warm with a thick winter coat?", "answers": ["A butterfly", "An Arctic fox", "A goldfish"], "correct": 1, "fact": "An Arctic fox has a thick coat that helps keep it warm."}, {"q": "What helps us see the Moon?", "answers": ["Moon batteries", "Sunlight reflected by the Moon", "A giant candle"], "correct": 1, "fact": "The Moon reflects light from the Sun."}]}, {"type": "message", "title": "A tiny winter poem", "text": "A window glows, a kettle sings,\nThe snowy street has silver wings.\nTwo little stars, our favourite pair,\nBring love and laughter everywhere.\n\nFor Mila and Jonah, from Grandma"}, {"type": "link", "title": "Make a song together", "text": "Sing your favourite winter song together, then make up a verse about Mila and Jonah. The optional link is a sample; replace it with your own family video or song.", "link": "https://example.com/family-song", "caption": "Open sample song link"}, {"type": "activity", "title": "The kindness lantern", "text": "Print a paper lantern outline. Colour it, cut around it with a grown-up, and write or draw a kind wish inside. Hang it by a window. Do not add a flame.", "activity": "lantern"}, {"type": "joke", "title": "A biscuit with a secret", "text": "What did one little biscuit whisper to the other?", "answer": "“You’re one smart cookie!” Grandma says you both are, too."}, {"type": "photo", "title": "Post from the little village", "text": "Sample illustration • The houses on Little Lantern Lane.", "photo": "sample:village", "caption": "Pick the window where Grandma and Grandpa would live. We’d leave the light on for you."}, {"type": "coupon", "title": "The family game invitation", "text": "Choose a family game tonight. Everyone puts their screens away and joins in.", "code": "PLAY-TOGETHER", "caption": "Mila and Jonah choose the game together."}, {"type": "message", "title": "One more sleep", "text": "Our favourite part of this season is you. Tomorrow’s final door holds an extra-big hug. Tonight, whisper one thing you’re grateful for.\nAll our love, Grandma & Grandpa"}, {"type": "finale", "title": "You are our brightest stars", "text": "Mila and Jonah,\nTwenty-four little doors, and so many lovely moments. But the greatest gift was there all along: our wonderful family.\nMay your day be full of laughter, kindness and the biggest hugs.\nMerry Christmas!\nAll our love, Grandma & Grandpa"}]}</script><style>@font-face{font-family:Display;src:url(data:font/woff2;base64,AAEAAAASAQAABAAgR0RFRgREBWgAAKsAAAAAKEdQT1N/X2edAACrKAAAFs5HU1VCMHYsGwAAwfgAAAE4TUFUSI7e19AAAMMwAAACsk9TLzJsinGWAAChWAAAAFZjbWFwAhEAuQAAobAAAAA8Y3Z0II8zq/QAAKfYAAABlGZwZ23ngPHEAACh7AAAAItnYXNwAAcABwAAqvQAAAAMZ2x5Zop6ajcAAAEsAACW/mhlYWQr2kxBAACbNAAAADZoaGVhEiANHQAAoTQAAAAkaG10eAV6d1YAAJtsAAAFyGxvY2Ff4TuwAACYTAAAAuZtYXhwBdAFMwAAmCwAAAAgbmFtZRvKNQgAAKlsAAABZnBvc3T/2wBaAACq1AAAACBwcmVwdXkG9gAAongAAAVeAAIBF//jAiEF1QALABEAbUASDwNhCWAMYhIOARANBgAMABASEMTUxPzEEO4xABDk9PzEMEA5vxG/EL8Pvw6vD68OkBGQEIARgBBwEXAQYBFgEF8PXw5PD08OPw8/DhAREBAQDxAOABEAEAAPAA4cAV1ACR8RHxAfDx8OBHElNDYzMhYVFAYjIiYTIQMVIzUBF0w5N05ONzlMBAECRHtoOE5OODdOTQWl/Mv8/AACAMkDqgLlBdUAAwAHABpACwUBBABiCAQGAAIIENTc1MwxABD0PMwyMAERIxEhESMRAWifAhyfBdX91QIr/dUCKwACAJ4AAAYXBb4AAwAfAFdANh0JBWMAFxMPYwIbCwAHBBkNAhURHx4cGxoXFhUUAQUCDBgTERAODQwJCAcGBAMADQoSChgCIBD0zMQRFzkRFzkxAC88xDIy1DzEMjIQ7jIyEO4yMjABIQMhCwEhEzMDIRUhAyEVIQMjEyEDIxMhNSETITUhEwQS/uZUAR08ZgEaZ6xpATT+pVIBOv6gZ6xp/uVoqmb+ywFcUv7EAWNoA4X+sgOH/mEBn/5hmv6ymf5iAZ7+YgGemQFOmgGfAAMArv7TBG0GFAAGAA0AMQBmQDkGDRQmBCEPLi0sDw4TAGUsISAlB2UbHRovLGAyIgogLhoTAwcJABAKDgMGIAgpLCUcAwAKBg4XAjIQ9MTsxBcy1OTsEO4Q7RcyEO4xABDkMtQ8xOwy1MQQ7jLWxhDAwBESFzkwJT4BNTQmJwMOARUUFhcBET function symbolFor(word){const shapes={STAR:'<path d="M24 5l5 13 14 1-11 9 4 14-12-8-12 8 4-14-11-9 14-1Z" fill="#c69348"/>',MITTEN:'<path d="M17 36V15q0-9 9-9t9 9v13q0 10-8 13H17l-9-12q-4-7 1-9t8 5" fill="#a5505b"/><path d="M16 34h17v9H16Z" fill="#f7f0dc"/>',TREE:'<path d="M21 32h6v12h-6Z" fill="#976745"/><path d="M24 5L9 24h7L6 36h36L32 24h7Z" fill="#567968"/><path d="M24 5l-7 9h14Z" fill="#faf5e4"/>',CUP:'<path d="M11 17h24v17q0 10-12 10T11 34Z" fill="#a34a57"/><path d="M35 20q17-2 10 13-3 6-10 4" fill="none"/><path d="M17 13q-5-4 0-8M26 13q-5-4 0-8" fill="none"/>',BELL:'<path d="M12 33q6-5 5-14 0-15 14-7 4 3 3 11l5 10Z" fill="#c99b53"/><circle cx="24" cy="37" r="4" fill="#a76d40"/>'};return shapes[word]?`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" aria-hidden="true" style="width:80%;max-width:50px;display:block;margin:auto" stroke="#77533b" stroke-width="1.5" stroke-linejoin="round">${shapes[word]}</svg>`:esc(word.slice(0,3))}

$$('[data-memory]').forEach(b=>b.onclick=()=>{const i=+b.dataset.memory;if(s.busy||s.face.includes(i)||s.matched.includes(i))return;s.face.push(i);sound('sparkle');if(s.face.length===2){s.moves++;s.busy=true;drawMemory();const[a,c]=s.face;later(()=>{if(gameState!==s)return;if(s.cards[a]===s.cards[c])s.matched.push(a,c);s.face=[];s.busy=false;if(s.matched.length===8)gameWin('You found all four pairs. Mila and Jonah, you make a brilliant team!');else drawMemory()},550)}else drawMemory()})}

function drawScramble(newWord=false){const s=gameState,w=s.words[s.index];if(newWord){s.pool=shuffled(w.split('').map((letter,i)=>({letter,id:i})));if(s.pool.map(x=>x.letter).join('')===w)s.pool.reverse();s.chosen=[]}$('#game').innerHTML=`<p class="game-status">Word ${s.index+1} of ${s.words.length} · ${w.length} letters</p><div class="word-result" aria-live="polite">${esc(s.chosen.map(i=>s.pool[i].letter).join('')||'· '.repeat(w.length))}</div><div class="letters">${s.pool.map((x,i)=>`<button data-letter="${i}" ${s.chosen.includes(i)?'disabled':''}>${esc(x.letter)}</button>`).join('')}</div><p class="fine">${w==='SNOW'?'Soft white flakes in winter.':w==='STAR'?'A little light in the night sky.':w==='COCOA'?'A cosy chocolate drink.':'Winter word: starts with '+w[0]+'.'}</p><button class="secondary" id="undo-word">Start this word again</button><p class="fine" id="word-feedback" role="status"></p>`;$('#undo-word').onclick=()=>{s.chosen=[];drawScramble()};$$('[data-letter]').forEach(b=>b.onclick=()=>{s.chosen.push(+b.dataset.letter);drawScramble();if(s.chosen.length===w.length){if(s.chosen.map(i=>s.pool[i].letter).join('')===w){$('#word-feedback').textContent='Lovely! That’s the word.';later(()=>{if(gameState!==s)return;s.index++;if(s.index===s.words.length)gameWin('You untangled every winter word. Clever little stars!');else drawScramble(true)},650)}else $('#word-feedback').textContent='Nearly! Try the letters in a different order.'}})}

async function compressPhoto(file){if(file.size>12*1024*1024)throw Error('Choose a photo smaller than 12 MB.');if(!['image/jpeg','image/png','image/webp'].includes(file.type))throw Error('Choose a JPEG, PNG or WebP photo.');const img=new Image(),url=URL.createObjectURL(file);try{img.src=url;await img.decode();const scale=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.fillStyle='#fff9ed';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);let quality=.84,data=c.toDataURL('image/jpeg',quality);while(data.length>500000&&quality>.4){quality-=.1;data=c.toDataURL('image/jpeg',quality)}return data}finally{URL.revokeObjectURL(url)}}

function ideaPack(context){const ideas=clone(DEFAULT_CONFIG.doors);if(context==='kids')return ideas;const greetings={partner:'A little note for my favourite person',team:'A little thank-you for our wonderful team',customers:'A little joy for our lovely customers'};const notes={partner:['Let’s have a slow evening together, with a cosy drink and no rush.','Tell me one lovely memory from this year. I’ll tell you mine.','You make ordinary days feel special. Thank you for being you.'],team:['Thank someone whose quiet work made your day easier.','Share one small success from this year. Every bit counts.','Take a five-minute pause and enjoy a warm drink. You’ve earned it.'],customers:['Thank you for being part of our little community.','Today, share a kind word with someone nearby.','Visit us for a seasonal hello. We’re glad you’re here.']};return ideas.map((d,i)=>{if(['message','finale'].includes(d.type))return {...d,title:i===23?'A season of gratitude':greetings[context],text:notes[context][i%3]};if(d.type==='coupon')return {...d,title:context==='customers'?'A seasonal thank-you':'A cosy little treat',code:context==='customers'?'SNOW15':'COSY-'+(i+1),text:context==='customers'?'15% off with code SNOW15. Maker: add your valid dates, shop link and offer terms.':'A warm drink and a moment to relax together.',caption:context==='customers'?'Sample offer. Set your own valid terms before sending.':'Redeem together, whenever you like.'};if(d.type==='photo')return {...d,caption:'Original sample illustration. Replace with your own memory or seasonal picture.'};return d})}

function drawPreview(){const date=previewDate||params.get('date')||'2026-12-12';$('#studio-panel').innerHTML=`<div class="form"><h3>Try a little time travel.</h3><p class="fine">Open any door here. Preview progress is separate from your family’s saved doors.</p>${field('Simulated date','preview-date',date,'input','date')}<div class="button-row">${[1,12,24].map(n=>`<button class="secondary" data-jump="${n}">${n} December</button>`).join('')}</div><div class="button-row"><button class="primary" id="start-preview">Preview calendar</button><button class="secondary" id="reset-preview">Reset preview progress</button></div><h3 style="margin-top:30px">Recipient device progress</h3><p class="fine">Resetting real progress needs a second click. This affects only this device.</p><button class="secondary" id="reset-real">Reset real opened doors and used vouchers</button></div>`;$$('[data-jump]').forEach(b=>b.onclick=()=>{$('#preview-date').value=draft.startDate.slice(0,4)+'-12-'+String(b.dataset.jump).padStart(2,'0')});$('#start-preview').onclick=()=>{previewDate=$('#preview-date').value;preview=true;config=clone(draft);$('#studio').close();render()};$('#reset-preview').onclick=()=>{previewState={opened:[],used:[]};toast('Preview doors and vouchers reset.')};let confirm=false;$('#reset-real').onclick=()=>{if(!confirm){confirm=true;$('#reset-real').textContent='Click again to confirm reset';return}normalState={opened:[],used:[]};saveStorage('progress',normalState);toast('Real progress reset on this device.');$('#reset-real').textContent='Progress reset'}}
function validateDoor(d){const types=['message','photo','link','recipe','joke','riddle','coupon','activity','game','finale'];if(!d||!types.includes(d.type))throw Error('Each door needs a supported surprise type.');if(d.type==='game'&&!['memory','sliding','scramble','quiz'].includes(d.game))throw Error('Choose one of the four games.');if(d.type==='game'&&d.game==='quiz'){if(!Array.isArray(d.questions)||d.questions.length!==3||d.questions.some(q=>typeof q.q!=='string'||!Array.isArray(q.answers)||q.answers.length!==3||!q.answers.every(a=>typeof a==='string')||!Number.isInteger(q.correct)||q.correct<0||q.correct>2))throw Error('The quiz needs three questions, three answers each and a correct answer index (0, 1 or 2).')}if(d.words&&(!Array.isArray(d.words)||!d.words.every(w=>typeof w==='string')))throw Error('Game words must be a list of text labels.');if((d.photo||'').length>5000000)throw Error('That embedded photo is too large. Choose it again to resize it.')}
function validateConfig(raw){if(!raw||typeof raw!=='object'||!Array.isArray(raw.doors))throw Error('Choose a calendar JSON backup.');const c={...clone(DEFAULT_CONFIG),...clone(raw),brand:{...DEFAULT_CONFIG.brand,...raw.brand}};if(![12,24,25].includes(c.numberOfDoors))throw Error('Choose 12, 24 or 25 doors.');if(!['Gift','Brand'].includes(c.mode)||!['Cosy village','Nordic forest','Gold and velvet'].includes(c.style))throw Error('Invalid mode or style.');if(!/^\d{4}-\d{2}-\d{2}$/.test(c.startDate)||isNaN(Date.parse(c.startDate+'T12:00:00Z'))||new Date(c.startDate+'T12:00:00Z').toISOString().slice(0,10)!==c.startDate)throw Error('Choose a valid first-door date.');if(c.timeZone!=='Recipient')try{new Intl.DateTimeFormat('en',{timeZone:c.timeZone})}catch{throw Error('Choose a valid IANA time zone, such as Europe/London.')}if(c.doors.length<c.numberOfDoors)throw Error('The backup has fewer surprises than doors.');c.doors=c.doors.slice(0,c.numberOfDoors);c.doors.forEach(validateDoor);for(const key of ['id','names','senders','passphrase'])if(typeof c[key]!=='string'||!c[key].trim())throw Error(`Please fill ${key}.`);return c}
function checklist(){let items=[];draft.doors.slice(0,draft.numberOfDoors).forEach((d,i)=>{if(!d.title?.trim()||!d.text?.trim())items.push(`Door ${i+1}: add a title and message.`);if(d.type==='coupon'&&!d.code?.trim())items.push(`Door ${i+1}: the voucher code is empty.`);if((d.photo||'').length>700000)items.push(`Door ${i+1}: embedded photo exceeds about 500 KB.`);if(d.type==='link'&&!safeLink(d.link))items.push(`Door ${i+1}: add a valid link.`);if(d.type==='link'&&(d.link||'').includes('example.com'))items.push(`Door ${i+1}: replace the sample link before sending.`);if(['joke','riddle'].includes(d.type)&&!d.answer?.trim())items.push(`Door ${i+1}: add the answer.`)});const real=localISO(new Date(),draft.timeZone==='Recipient'?Intl.DateTimeFormat().resolvedOptions().timeZone:draft.timeZone);const passed=Math.min(draft.numberOfDoors,Math.max(0,diff(real,draft.startDate)+1));if(passed)items.push(`${passed} door date${passed===1?' is':'s are'} today or in the past (${real}).`);return items}
function exportHTML(c=draft){const marker=/<script id="calendar-config" type="application\/json">[\s\S]*?<\/script>/;const data=JSON.stringify(c,null,2).replace(/</g,'\\u003c');return ORIGINAL_HTML.replace(marker,()=>'<script id="calendar-config" type="application/json">'+data+'</'+'script>')}
function download(name,text,type='text/plain'){const url=URL.createObjectURL(new Blob([text],{type}));const a=document.createElement('a');a.href=url;a.download=name;a.click();later(()=>URL.revokeObjectURL(url),3000)}
function drawExport(){const issues=checklist();$('#studio-panel').innerHTML=`<h3>Your gift, ready for its journey.</h3><div class="checklist"><strong>Before you send</strong>${issues.length?`<ul>${issues.map(t=>`<li>${esc(t)}</li>`).join('')}</ul>`:'<p>✓ Every door has content · Photos are a lovely size · Voucher codes are filled · All door dates are still ahead.</p>'}<p class="fine">Sample illustrations are safe to send. Replace the optional sample song link with your own.</p></div><div class="button-row" style="justify-content:flex-start"><button class="primary" id="export-html">Download index.html</button><button class="secondary" id="export-json">JSON backup</button></div><div class="form">${field('Restore a JSON backup','import-json','','input','file')}<p class="fine" id="import-status" role="status"></p><h3 style="margin-top:28px">A little card to put under the tree.</h3><p class="fine">After hosting your exported file, paste its final public link. A file on your device cannot be opened through a QR code on someone else’s phone.</p>${field('Final calendar link (https://…)','final-url',safeLink(readStorage('final-url',''))||'','input','url')}<div class="button-row" style="justify-content:flex-start"><button class="primary" id="make-card">Show QR gift card</button></div><p class="studio-note">QR codes are generated here, offline. Links up to 134 UTF-8 bytes are supported.</p></div>`;$('#import-json').accept='application/json,.json';$('#export-html').onclick=()=>{try{validateConfig(draft);download('index.html',exportHTML(),'text/html');toast('Your self-contained calendar is downloaded.')}catch(e){toast(e.message)}};$('#export-json').onclick=()=>download('calendar-backup.json',JSON.stringify(draft,null,2),'application/json');$('#import-json').onchange=async()=>{try{const file=$('#import-json').files[0];if(!file||file.size>15000000)throw Error('Choose a JSON backup smaller than 15 MB.');draft=validateConfig(JSON.parse(await file.text()));saveDraft();$('#import-status').textContent='✓ All doors and settings restored. Open “Fill the doors” to review.'}catch(e){$('#import-status').textContent=e.message}};$('#make-card').onclick=()=>{const link=$('#final-url').value.trim();if(!/^https?:\/\//.test(link)||!safeLink(link)){toast('Paste the hosted calendar’s http or https link first.');return}try{showGift(link);saveStorage('final-url',link)}catch(e){toast(e.message)}}}

// ---------- Original small QR encoder: fixed QR version 6, L, byte mode, mask 0 ----------
// Two 68-byte data blocks, 18 Reed–Solomon bytes per block. 4-module quiet zone.
function qrMatrix(text){const bytes=new TextEncoder().encode(text);if(bytes.length>134)throw Error('Please use a final link up to 134 UTF-8 bytes.');let bits=[];const push=(n,len)=>{for(let i=len-1;i>=0;i--)bits.push((n>>>i)&1)};push(4,4);push(bytes.length,8);bytes.forEach(b=>push(b,8));push(0,Math.min(4,1088-bits.length));while(bits.length%8)bits.push(0);let data=[];for(let i=0;i<bits.length;i+=8)data.push(bits.slice(i,i+8).reduce((a,b)=>(a<<1)|b,0));let pad=0;while(data.length<136)data.push(pad++%2===0?0xec:0x11);
const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11d);z^=((y>>>i)&1)*x}return z};let divisor=Array(18).fill(0);divisor[17]=1;let root=1;for(let i=0;i<18;i++){for(let j=0;j<18;j++){divisor[j]=mul(divisor[j],root);if(j+1<18)divisor[j]^=divisor[j+1]}root=mul(root,2)}const rem=a=>{let r=Array(18).fill(0);for(const b of a){let f=b^r.shift();r.push(0);for(let j=0;j<18;j++)r[j]^=mul(divisor[j],f)}return r};const block=[data.slice(0,68),data.slice(68)],ecc=block.map(rem),cw=[];for(let i=0;i<68;i++)for(let b=0;b<2;b++)cw.push(block[b][i]);for(let i=0;i<18;i++)for(let b=0;b<2;b++)cw.push(ecc[b][i]);const n=41,m=Array.from({length:n},()=>Array(n).fill(false)),reserved=Array.from({length:n},()=>Array(n).fill(false));const set=(x,y,v)=>{if(x>=0&&y>=0&&x<n&&y<n){m[y][x]=!!v;reserved[y][x]=true}};
for(let i=0;i<n;i++){set(6,i,i%2===0);set(i,6,i%2===0)}for(const[cx,cy]of[[3,3],[37,3],[3,37]])for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy));set(cx+dx,cy+dy,d!==2&&d!==4)}for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)set(34+dx,34+dy,Math.max(Math.abs(dx),Math.abs(dy))!==1);
function format(){const value=8;let r=value;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const f=((value<<10)|r)^0x5412;const b=i=>((f>>>i)&1)!==0;for(let i=0;i<=5;i++)set(8,i,b(i));set(8,7,b(6));set(8,8,b(7));set(7,8,b(8));for(let i=9;i<15;i++)set(14-i,8,b(i));for(let i=0;i<8;i++)set(n-1-i,8,b(i));for(let i=8;i<15;i++)set(8,n-15+i,b(i));set(8,n-8,true)}format();let k=0;for(let right=n-1;right>=1;right-=2){if(right===6)right=5;for(let v=0;v<n;v++){const y=(((right+1)&2)===0)?n-1-v:v;for(let j=0;j<2;j++){const x=right-j;if(!reserved[y][x]){const bit=k<cw.length*8?((cw[k>>>3]>>>(7-(k&7)))&1):0;m[y][x]=!!(bit^((x+y)%2===0?1:0));k++}}}}return m}
function qrSVG(link){const m=qrMatrix(link),n=m.length+8;let p='';m.forEach((row,y)=>row.forEach((b,x)=>{if(b)p+=`M${x+4} ${y+4}h1v1h-1Z`}));return `<svg class="qr" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n} ${n}" role="img" aria-label="QR code for ${esc(link)}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="white"/><path d="${p}" fill="#12212c"/></svg>`}
function giftMarkup(link){return `<article class="gift-card"><p class="eyebrow">A December to remember</p><div class="gift-art">${sampleSVG('village')}</div><h2>For ${esc(draft.mode==='Gift'?draft.names:draft.brand.name)}</h2><p>A little surprise, every day.</p>${qrSVG(link)}<p><strong>Scan to open your calendar</strong></p><p class="fine">With love from ${esc(draft.mode==='Gift'?draft.senders:draft.brand.name)}</p><p style="font-size:7px;overflow-wrap:anywhere">${esc(link)}</p></article>`}
function showGift(link){const markup=giftMarkup(link);$('#gift-content').innerHTML=markup+'<div class="button-row"><button class="primary" id="print-gift">Print A6 gift card</button></div>';$('#print-gift').onclick=()=>printMarkup(markup,'A6');modal('#gift')}

// ---------- 75-second recording tour: isolated in-memory state; no downloads or storage ----------
function stopTour(){if(!tourRunning)return;tourRunning=false;for(const t of timers)clearTimeout(t);timers.clear();closeAll();document.querySelectorAll('.confetti').forEach(e=>e.remove());preview=false;previewDate='';studioUnlocked=false;config=clone(CONFIG);draft=clone(CONFIG);$('#tour-caption').style.display='none';$('#toast').classList.remove('show');history.replaceState(null,'',location.pathname+(isCover?'?cover=1':'')+location.hash.replace('#studio',''));render()}
function tourCaption(text){$('#tour-caption').textContent=text;$('#tour-caption').style.display='block'}
function tourStudio(tab){studioUnlocked=true;studioTab=tab;draft=clone(CONFIG);showStudio()}
function tourStep(index){const steps=[
()=>{closeAll();previewDate='2026-12-12';render();tourCaption('A little village of surprises, for Mila and Jonah.');},
()=>{const b=$('[data-day="18"]');b.classList.add('wiggle');later(()=>b.classList.remove('wiggle'),600);toast('Not yet: 6 sleeps to go · 18 December');tourCaption('One door each day. Future windows keep their secrets.');},
()=>{openDoor(12);tourCaption('Today’s window opens with a little sparkle.');},
()=>{showSurprise(12);tourCaption('A family photo, or a lovingly illustrated memory.');},
()=>{showSurprise(6);if(!tourState.opened.includes(6))tourState.opened.push(6);tourCaption('A voucher for one very cosy cocoa.');},
()=>{tourState.used.push(6);showSurprise(6);tourCaption('Mark it as used when the marshmallows arrive.');},
()=>{showSurprise(4);tourState.opened.push(4);tourCaption('Take turns finding the little matching pairs.');tourPlayMemory();},
()=>{showSurprise(9);tourState.opened.push(9);tourCaption('Slide the tiles to mend the glowing lantern.');tourPlaySliding();},
()=>{$('#surprise').close();showAlbum();tourCaption('Keep every opened surprise in your little album.');},
()=>{$('#album').close();tourStudio('doors');selectedDay=17;drawEditor();tourCaption('Grandparents can fill every door, without any code.');},
()=>{draft.doors[16]=ideaPack('kids')[16];drawEditor();$('#save-status').textContent='✓ A ready-made little poem, saved in this tour’s draft.';tourCaption('A ready-made idea is just one click away.');},
()=>{studioTab='preview';drawStudio();$('#preview-date').value='2026-12-24';tourCaption('Preview any date, without changing the real calendar.');},
()=>{$('#studio').close();previewDate='2026-12-24';config=clone(draft);render();openDoor(24);tourCaption('The last window holds an extra-big Christmas hug.');},
()=>{$('#surprise').close();studioTab='export';drawStudio();$('#final-url').value='https://example.com/mila-and-jonah';tourCaption('Export one file. Host it free, or keep it on the family tablet.');},
()=>{showGift('https://example.com/mila-and-jonah');tourCaption('A little gift card, ready to put under the tree.');}
];steps[index]?.()}
function tourPlayMemory(){const s=gameState, pairs={};s.cards.forEach((w,i)=>(pairs[w]??=[]).push(i));Object.values(pairs).forEach((pair,k)=>{later(()=>{$(`[data-memory="${pair[0]}"]`)?.click()},500+k*1150);later(()=>{$(`[data-memory="${pair[1]}"]`)?.click()},850+k*1150)})}
function puzzleSolution(tiles){const start=tiles.join(''),target='012345678';let queue=[[start,[]]],seen=new Set([start]);for(let h=0;h<queue.length;h++){const[s,path]=queue[h];if(s===target)return path;const z=s.indexOf('8');for(const i of [z-3,z+3,z-1,z+1])if(i>=0&&i<9&&Math.abs(i%3-z%3)+Math.abs(Math.floor(i/3)-Math.floor(z/3))===1){const a=s.split('');[a[z],a[i]]=[a[i],a[z]];const next=a.join('');if(!seen.has(next)){seen.add(next);queue.push([next,[...path,i]])}}}return []}
function tourPlaySliding(){puzzleSolution(gameState.tiles).forEach((i,k)=>later(()=>$(`[data-tile="${i}"]`)?.click(),500+k*550))}
if(isTour){const times=[0,5000,10000,15000,20000,24000,28000,35500,43000,47500,52000,56500,61000,66500,70500];times.forEach((ms,i)=>later(()=>tourStep(i),ms));later(()=>{$('#tour-caption').textContent='Made with love. Your tour is complete.';window.dispatchEvent(new CustomEvent('tour-complete'))},75000);document.addEventListener('pointerdown',e=>{if(e.isTrusted)stopTour()},true);document.addEventListener('keydown',e=>{if(e.isTrusted)stopTour()},true)}
else if(location.hash==='#studio')showStudio();
addEventListener('hashchange',()=>{if(location.hash==='#studio')showStudio()});
// Date rollovers and foreground returns update labels without losing opened doors.
let lastDate=today();setInterval(()=>{const now=today();if(now!==lastDate){lastDate=now;render()}},30000);document.addEventListener('visibilitychange',()=>{if(!document.hidden&&today()!==lastDate){lastDate=today();render()}});
// Tilt only where the browser already permits it. iOS gets a clear opt-in on enabling sound.
function tilt(e){if(reduced||!$('.art'))return;$('.art').style.setProperty('--px',Math.max(-3,Math.min(3,(e.gamma||0)/10))+'px');$('.art').style.setProperty('--py',Math.max(-3,Math.min(3,(e.beta||0)/20))+'px')}
if(!reduced&&typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission!=='function')addEventListener('deviceorientation',tilt);
$('#surprise').addEventListener('close',()=>requestAnimationFrame(()=>{if(!$$('dialog[open]').length)$(`[data-day="${currentDoor}"]`)?.focus({preventScroll:true})}));
