function welcome(){return `<main class="container welcome"><div class="welcome-copy"><span class="eyebrow">FRIENDS, FAMILIES & A LITTLE FRIENDLY RIVALRY</span><h1>Big ideas.<br><em>Small-town sparkle.</em></h1><p>Pull up a chair. Gather your people. Our reading room is becoming a holiday game show — and everyone has a bright idea to bring.</p><div class="flex"><span class="chip">${active(E.state).length} teams</span><span class="chip">${E.state.rounds.reduce((n,r)=>n+r.count,0)} questions</span><span class="chip">About ${E.state.event.duration} minutes</span></div><div class="welcome-actions"><button id="start-show" class="primary" data-do="begin">${E.state.schedule.length?'Resume the show':'Let’s light up the show'} <span aria-hidden="true">↗</span></button><button data-go="host">Host Studio</button></div><div class="event-line"><div><strong>${esc(E.state.event.date)}</strong><span>${esc(E.state.event.time)} · All ages welcome</span></div><div><strong>${esc(E.state.event.venue)}</strong><span>${esc(E.state.event.room)} · ${esc(E.state.event.town)}</span></div></div><div class="prize-note"><span class="prize-icon" aria-hidden="true">✧</span><span>Tonight’s prize: ${esc(E.state.event.prize)}.<br>${CONFIG.credit.enabled?`Hosted by ${esc(E.state.host)}. `:''}Faraway friends welcome on video.</span></div></div><div>${stagePreview()}<p class="muted" style="text-align:center;font-size:12px;margin-top:16px">${esc(E.state.pack.toUpperCase())} EDITION <span style="padding:0 10px">/</span> ${esc(E.state.style.toUpperCase())}</p></div></main>`;}
function hostStudio(){const s=E.state;return `<main class="container"><div class="section-heading"><div><span class="eyebrow">BACKSTAGE / HOST ONLY</span><h1 style="font-size:43px;margin-top:8px">Your night. Your studio.</h1><p class="muted">Set the room, cue the questions, make a little magic.</p></div><div class="flex"><button data-do="tv">Open TV window ↗</button><button class="primary" data-do="begin">${s.schedule.length?'Back to live controls':'Start the show'} ↗</button></div></div>${corruptRaw?`<div class="notice">Your saved quiz could not be read. A separate damaged copy is kept; new progress saves normally. <button class="small" data-do="bad-download">Download unreadable save</button> Import a valid backup or start a new quiz.</div>`:''}${s.schedule.length?`<div class="notice flex"><strong>LIVE · ${esc(question(s)?.type||'Show')}</strong><span>Question ${s.cursor+1} · ${esc(question(s)?.prompt||'')}</span><button class="small primary" data-go="show">Open live controls</button></div>`:''}<div class="section-tabs" role="group" aria-label="Studio sections">${[['setup','Teams & rounds'],['bank','Question bank'],['history','Scores & history'],['settings','Show settings']].map(([v,label])=>`<button class="${section===v?'active':''}" data-section="${v}">${label}</button>`).join('')}</div>${section==='setup'?setupPanel():section==='bank'?bankPanel():section==='history'?historyPanel():settingsPanel()}</main>`;}
function setupPanel(){const s=E.state;const total=s.rounds.reduce((n,r)=>n+r.count,0);return `<div class="host-grid"><section class="card"><div class="card-title"><div><span class="eyebrow">THE BRIGHT MINDS</span><h2 style="margin-top:7px">Teams <span class="muted">/ ${s.teams.length}</span></h2></div><button class="small" data-do="add-team">+ Add team</button></div>${s.teams.map((t,i)=>`<div class="team-row" style="${!t.active?'opacity:.5':''}"><span class="badge" style="--team:${esc(t.color)}">${esc(t.badge||t.name.slice(0,2))}</span><div class="team-meta"><strong>${esc(t.name)}${!t.active?' · Withdrawn':''}</strong><small>${esc(t.players||'Player names optional')}</small></div><div class="flex" style="gap:4px"><button class="icon-button" aria-label="Edit ${esc(t.name)}" data-edit-team="${esc(t.id)}">✎</button><button class="icon-button" aria-label="Move ${esc(t.name)} up" data-up-team="${esc(t.id)}" ${i===0?'disabled':''}>↑</button></div></div>`).join('')}<p class="muted" style="font-size:12px;margin-top:17px">2–8 teams · 3–6 people recommended per team.<br>A remote team can join by video. Read their answer aloud or mark it from the call.</p></section><section class="card"><div class="card-title"><div><span class="eyebrow">THE RUNNING ORDER</span><h2 style="margin-top:7px">Six ways to shine.</h2></div><span class="chip">${total} questions</span></div><div class="flex" style="margin-bottom:15px"><label for="pack-select" style="margin:0">Theme pack</label><select id="pack-select" style="width:auto;flex:1" ${s.schedule.length?'disabled':''}>${['Christmas','New Year','Office Party','Classroom'].map(p=>`<option ${s.pack===p?'selected':''}>${p}</option>`).join('')}</select></div>${s.rounds.map((r,i)=>`<div class="round-row"><span class="round-number">0${i+1}</span><div><strong>${esc(r.type)}</strong><small>${r.count} questions · ${r.seconds}s · ${r.type==='Final Wager'?'Points wager':pointsText(r.points)} · ${r.mode==='phone'?'Pass the phone':r.mode}${r.partial?' · Partial points':''}</small></div><button class="icon-button" aria-label="Edit round ${i+1}" data-edit-round="${i}" ${s.schedule.length?'disabled':''}>${roundIcons[r.type]}</button></div>`).join('')}<p class="muted" style="font-size:12px;margin-top:15px">${s.event.duration}-minute ${esc(s.pack)} preset: 3 min welcome · 67 min rounds · 3 min break · 2 min awards. Pace the show with Next.</p></section></div><div class="studio-bottom"><div class="card"><span class="eyebrow">THE QUESTION VAULT</span><p class="stat-big">${s.bank.length} original questions</p><p class="muted" style="font-size:13px">Four packs. Three difficulty levels. A fact behind every answer.</p></div><div class="card"><span class="eyebrow">THE ROOM IS READY</span><p class="stat-big">One laptop. One screen.</p><p class="muted" style="font-size:13px">Offline TV window, paper sheets or shared-keyboard buzzers.</p></div><div class="card"><span class="eyebrow">YOUR SAFETY NET</span><p class="stat-big">Every move remembered.</p><div class="toolbar"><button class="small" data-do="export">Export backup</button><button class="small" data-do="import">Import backup</button></div></div></div>`;}
function settingsPanel(){const s=E.state;return `<div class="host-grid"><section class="card"><span class="eyebrow">DRESS THE STAGE</span><h2 style="margin:10px 0 22px">Choose your atmosphere.</h2>${Object.keys(CONFIG.styles).map((k,i)=>`<button style="width:100%;text-align:left;margin:6px 0;padding:20px" data-style="${k}"><strong>${s.style===k?'● ':'○ '}${k}</strong><span class="muted" style="display:block;font-size:13px;margin-top:5px">${esc(CONFIG.styles[k].prop)}</span></button>`).join('')}</section><section class="card"><h3>Host essentials</h3><p class="muted" style="margin:12px 0 20px">Open the TV window before sharing your screen. Share that window only, so answers and wagers remain backstage.</p><div class="toolbar"><button data-do="tv">Open TV window</button><button data-action="CALL">${s.callLayout?'Standard':'Video-call'} layout</button><button data-action="MUTE">${s.muted?'Unmute sound':'Mute sound'}</button><button data-do="fullscreen">Fullscreen</button></div><p class="muted" style="font-size:13px;margin-top:20px">The phone view runs on that device. It does not remotely control a separate laptop. Cast the phone or hand it around for its local big buttons. No live phone buzzer service is implied.</p><div class="toolbar"><button data-do="export">Export backup</button><button data-do="import">Import backup</button><button class="danger" data-do="new">Start a new quiz</button></div></section></div>`;}
function bankPanel(){const s=E.state,counts={};s.bank.forEach(q=>counts[q.pack]=(counts[q.pack]||0)+1);const cats={};s.bank.forEach(q=>cats[q.category]=(cats[q.category]||0)+1);const filtered=s.bank.filter(q=>(!bankFilter||(q.prompt+' '+q.category+' '+q.pack).toLowerCase().includes(bankFilter.toLowerCase()))&&(!bankType||q.type===bankType));return `<section class="card"><div class="card-title"><div><h2>The question vault</h2><p class="muted" style="font-size:13px;margin-top:9px">${Object.entries(counts).map(([p,n])=>`${p}: ${n}`).join(' · ')}</p></div><div class="flex"><button class="small" data-do="csv-export">Export CSV</button><button class="small" data-do="csv-import">Import CSV</button><button class="small primary" data-do="add-question">+ Question</button></div></div><div class="form-grid"><div><label for="bank-search">Search questions, categories or packs</label><input id="bank-search" value="${esc(bankFilter)}" placeholder="Try winter, science or Christmas"></div><div><label for="bank-type">Round type</label><select id="bank-type"><option value="">All six types</option>${TYPES.map(t=>`<option ${t===bankType?'selected':''}>${t}</option>`).join('')}</select></div></div><p class="muted" style="font-size:12px;margin:17px 0">${Object.entries(cats).map(([c,n])=>`${esc(c)} (${n})`).join(' · ')}</p><div class="bank-list">${filtered.map(q=>`<div class="bank-row"><div><small>${esc(q.pack)} / ${esc(q.type)} / ${esc(q.category)} / ${esc(q.difficulty)}</small><strong>${esc(q.prompt)}</strong><p class="muted">${esc(q.answer)} · ${esc(q.note)}</p></div><button class="small" data-edit-question="${esc(q.id)}">Edit</button></div>`).join('')}</div></section>`;}
function historyPanel(){const s=E.state;return `<div class="host-grid"><section class="card"><div class="card-title"><h2>The live ledger</h2><button data-do="fix" class="small">Fix a score</button></div>${scoreRows(s)}<div class="toolbar"><button data-action="UNDO" ${!E.past.length?'disabled':''}>↶ Undo</button><button data-action="REDO" ${!E.future.length?'disabled':''}>↷ Redo</button><button data-do="tie">Call tie-breaker</button></div></section><section class="card"><h2>Every move</h2><p class="muted" style="margin:10px 0">${E.actions.length} recorded actions. Undo preserves the full replay trail.</p><div class="history-list">${E.actions.map((a,i)=>`<div class="history-line"><small>${String(i+1).padStart(3,'0')}</small> · <strong>${esc(a.type)}</strong> <span class="muted">${esc(actionDescription(a,s))}</span></div>`).reverse().join('')||'<p class="muted">The first cue is yours.</p>'}</div></section></div>`;}
function actionDescription(a,s){const p=a.payload||{},t=s.teams.find(t=>t.id===p.id);if(a.type==='WAGER')return t?.name+' · sealed';if(a.type==='FIX')return `${t?.name}: ${p.amount} · ${p.reason}`;if(a.type==='MARK')return `${t?.name}: ${p.right?'right':'wrong'}${p.order?' / order scored':''}`;if(t)return t.name;return p.style||p.screen||p.pack||'';}
function teamStrip(s){const list=s.teams.filter(t=>t.active),max=Math.max(...list.map(t=>t.score));return `<div class="team-strip">${list.map(t=>`<div class="team-pill ${t.score===max?'leader':''}" style="--team:${esc(t.color)}"><i class="team-dot"></i><span>${esc(t.name)}</span><strong>${fmt(t.score)}</strong>${question(s)&&settings(s).mode==='buzzer'?`<kbd>${esc(t.key.toUpperCase())}</kbd>`:''}</div>`).join('')}</div>`;}
function fmt(n){return Number.isInteger(n)?String(n):String(Number(n.toFixed(2)));}
function clockText(ms){const n=Math.ceil(ms/1000);return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0');}
function hostScript(s){if(s.screen==='podium'){const ts=leaderboard(s).filter(t=>t.active),wins=ts.filter(t=>t.score===ts[0]?.score);return `Say: A round of applause for ${wins.map(t=>t.name).join(' and ')}. ${wins.length>1?'We have a tie at the top.':'Our champion tonight!'} Thank you for sharing your bright ideas.`;}if(s.screen==='scoreboard')return 'Say: Let’s see where every bright idea has taken us.';const q=question(s);if(!q)return `Say: Welcome to ${s.show}. Let’s light up the room!`;return `Say: ${s.tieIds?'Tie-breaker':`Round ${q.round+1}`}, ${q.type}. ${q.type==='Order It'?q.prompt:q.type==='Picture'?'Look closely. What is it?':q.type==='Closest Number'?'Agree one number. The closest teams share the points.':q.type==='Final Wager'?'Everyone answers. Keep your wager secret. Points only.':'Talk together, then give one answer.'}`;}
function showStage(s=E.state,tv=false){const q=question(s),score=s.screen==='scoreboard',podium=s.screen==='podium',wager=s.screen==='wager';if(!q&&!score&&!podium)return `<div class="stage-shell"><main class="show-stage preshow"><div class="stage-content">${stagePreview()}<p class="preshow-event">${esc(s.event.date)} · ${esc(s.event.time)}<br>${esc(s.event.venue)} · ${esc(s.event.town)}</p></div>${teamStrip(s)}</main>${tv?'':`<div class="host-bar"><button class="primary" data-do="begin">Start the show ↗</button><button data-go="host">Host Studio</button></div>`}</div>`;const content=score?scoreboard(s):podium?podiumScreen(s):wager?wagerScreen(s):questionScreen(s);return `<div class="stage-shell ${s.callLayout?'call-layout':''}"><div class="tinsel"></div><main class="show-stage ${podium?'podium-stage':''}"><div class="stage-top"><div><div class="stage-brand">${esc(s.show)}</div><div class="eyebrow" style="margin-top:5px">${score?'THE LIVE STANDINGS':podium?'THE GRAND FINALE':s.tieIds?'THE TIE-BREAKER':`ROUND ${q.round+1} / ${esc(q.type)}`}</div></div>${!score&&!podium?`<div class="stage-clock" id="clock" aria-label="Time remaining">${clockText(isTV?s.timer.remaining:remaining())}</div>`:`<span class="stage-edition">✦ ${esc(s.pack)} edition</span>`}</div><div class="stage-content">${s.paused?'<div class="pause-banner">Show paused · Take a breath.</div>':''}${content}</div>${s.callLayout?`<div class="host-script">${esc(hostScript(s))}</div>`:''}${!podium?teamStrip(s):''}</main>${tv?'':hostBar(s)}</div>${tv?'':liveControls(s)}`;}
function questionScreen(s){const q=question(s),revealed=s.revealed;return `<section class="question-card ${q.type==='Picture'?'picture-question':''} ${q.options.length?'options-question':''} ${q.type==='Final Wager'&&revealed?'final-reveal':''}" aria-label="Question"><div class="q-meta"><span>${s.tieIds?'Tie-breaker':`Question ${q.number} of ${q.settings.count}`}</span><span>${q.type==='Final Wager'?'Your secret wager':pointsText(q.settings.points)}${q.type==='Order It'&&q.settings.partial?' · 1 point per correct position':''}</span></div><h1 class="question-text ${q.prompt.length>95?'long':''}">${esc(q.prompt)}</h1>${q.type==='Picture'?pictureSVG(q.picture,pictureMode(q.picture,revealed)):''}${q.options.length?`<div class="options">${(revealed&&q.type==='Order It'?q.order:q.options).map((o,i)=>`<div class="option ${revealed&&(q.type==='Order It'||o===q.answer)?'correct':''}"><b>${q.type==='Order It'?i+1:String.fromCharCode(65+i)}</b><span>${esc(o)}</span></div>`).join('')}</div>`:''}${revealed?`<div class="answer-panel"><strong>${q.type==='Order It'?'The correct order':esc(q.answer)}</strong><p>${esc(q.note)}</p>${q.type==='Closest Number'?`<p>${nearestNames(s)}</p>`:''}</div>${q.type==='Final Wager'?`<div class="wager-results">${active(s).map(t=>`<div class="wager-result"><strong>${esc(t.name)}</strong><span class="wager-detail">${pointsText(s.wagers[t.id]?.amount||0)} wager · ${s.marks[t.id]===undefined?'Awaiting mark':pointsText(s.marks[t.id])}</span></div>`).join('')}</div>`:''}`:q.type==='Closest Number'?'<p class="question-hint">One number per team. Nearest wins. Ties share the points.</p>':''}</section>${s.buzz.length?`<div class="buzz-banner">${s.buzz.map((id,i)=>`${i===0?'LOCKED FIRST':'then'}: ${esc(s.teams.find(t=>t.id===id)?.name)}`).join(' → ')}</div>`:s.armed?'<div class="buzz-banner">BUZZERS OPEN · First press locks scoring.</div>':''}`;}
function nearestNames(s){const wins=active(s).filter(t=>s.marks[t.id]>0);return wins.length?`${wins.length>1?'Shared win':'Nearest'}: ${wins.map(t=>esc(t.name)).join(' and ')} · ${pointsText(wins[0]?Number(s.marks[wins[0].id].toFixed(2)):0)} each.`:'No numeric answers marked yet.';}
function scoreRows(s){const sorted=leaderboard(s),max=Math.max(1,...sorted.map(t=>t.score));return sorted.map(t=>`<div class="score-row ${t.score===sorted[0].score?'leader':''}" data-team-row="${esc(t.id)}"><div class="score-fill" style="--width:${Math.max(0,t.score/max*100)}%"></div><span class="rank">${rank(s,t)===1?'✦':String(rank(s,t)).padStart(2,'0')}</span><div class="score-name">${esc(t.name)} <small>${!t.active?'Withdrawn':sorted.filter(x=>x.score===t.score).length>1?'Tied '+rank(s,t):''}</small></div><span class="score-points">${fmt(t.score)}</span></div>`).join('');}
function scoreboard(s){return `<section class="scoreboard"><div class="board-heading"><h2>Every bright idea counts.</h2><p>${esc(s.notice.includes('corrected')?s.notice:'The live standings · Equal scores share their rank.')}</p></div>${scoreRows(s)}</section>`;}
function awards(s){const maxNames=map=>{const m=Math.max(0,...Object.values(map));return m?Object.entries(map).filter(([id,v])=>v===m).map(([id])=>s.teams.find(t=>t.id===id)?.name).join(' and '):'Not awarded yet';};const fingers={},eyes={},bold={};(s.firstBuzz||[]).forEach(b=>fingers[b.team]=(fingers[b.team]||0)+1);s.ledger.forEach(l=>{const q=s.schedule.find(q=>q.id===l.q);if(q?.type==='Picture'&&l.kind==='mark')eyes[l.team]=(eyes[l.team]||0)+l.points;if(l.kind==='wager'&&l.points>0)bold[l.team]=Math.max(bold[l.team]||0,l.points);});return [{title:'Swift Spark',name:maxNames(fingers)},{title:'Sharpest Eyes',name:maxNames(eyes)},{title:'Bold Move',name:maxNames(bold)}];}
function podiumScreen(s){const teams=leaderboard(s).filter(t=>t.active),best=teams[0]?.score,win=teams.filter(t=>t.score===best);return `<section class="podium-content"><div class="board-heading"><span class="eyebrow">A ROOM FULL OF STARS</span><h2>${win.length>1?(s.jointAccepted?'Our joint champions!':'A tie at the top!'):'A brilliant finish!'}</h2><p>${esc(win.map(t=>t.name).join(' and '))} · ${pointsText(best||0)}</p></div><div class="podium">${[teams[1],teams[0],teams[2]].filter(Boolean).map(t=>`<div class="podium-step ${t.score===best?'first':''}"><span class="podium-star" aria-hidden="true">${t.score===best?'✦':'✧'}</span><h3>${esc(t.name)}</h3><p>${pointsText(t.score)}</p><p>${rank(s,t)===1?'Champion':`Rank ${rank(s,t)}`}</p></div>`).join('')}</div><div class="award-strip">${awards(s).map(a=>`<div class="award"><b>${a.title}</b><span>${esc(a.name)}</span></div>`).join('')}</div><p class="prize-caption">${esc(s.event.prize)}. A whole room of good company.</p></section>`;}
function wagerScreen(s){return `<section class="question-card wager-card"><span class="wager-lock" aria-hidden="true">✦</span><h1 class="question-text">One last bright idea.</h1><p style="font-size:26px;color:var(--muted);max-width:800px">Choose your secret wager: 0 up to your current score.<br>Correct adds it. Incorrect subtracts it. Points only.</p><div class="flex" style="justify-content:center;font-size:22px">${active(s).map(t=>`<span class="chip" style="font-size:20px">${esc(t.name)} · ${s.wagers[t.id]?'Sealed ✓':'Thinking…'}</span>`).join('')}</div><p style="font-size:22px;color:var(--gold)">Keep the last question hidden until every wager is sealed.</p></section>`;}
function hostBar(s){const q=question(s),ts=leaderboard(s).filter(t=>t.active),tied=ts.filter(t=>t.score===ts[0]?.score).length>1;return `<div class="host-bar" aria-label="Host controls"><div class="flex">${s.screen==='podium'&&tied?`<button class="primary" data-do="tie">Play the tie-breaker</button><button data-action="ACCEPT_JOINT">Accept joint winners</button>`:''}<button id="next" data-do="next" class="primary" ${!q||s.screen==='podium'?'disabled':''}>Next ↗</button><button id="reveal" data-action="REVEAL" ${!q||s.revealed||s.screen==='wager'?'disabled':''}>Reveal <kbd>R</kbd></button><button id="timer-button" data-action="TIMER" ${!q||s.revealed||s.paused||s.screen!=='question'?'disabled':''}>${s.timer.running?'Stop':'Start'} timer</button><button data-action="PAUSE">${s.paused?'Resume':'Pause'}</button><button data-action="VIEW" data-screen="scoreboard">Scores</button></div><div class="flex"><button data-action="UNDO" ${!E.past.length?'disabled':''} aria-label="Undo last action">↶</button><button data-action="REDO" ${!E.future.length?'disabled':''} aria-label="Redo last action">↷</button><button data-go="host">Studio</button><button data-action="MUTE" aria-label="${s.muted?'Unmute':'Mute'} sound">${s.muted?'Sound off':'Sound on'}</button></div><span class="shortcuts">N next · R reveal · T timer · Z undo · F fullscreen · M mute</span></div>`;}
function liveControls(s){const q=question(s);if(!q)return '';return `<section class="host-controls"><div class="section-heading"><div><span class="eyebrow">HOST ONLY · KEEP THIS WINDOW OFF THE CALL</span><h3 style="margin-top:8px">${s.screen==='wager'?'Seal wagers, one team at a time':s.revealed?'Mark the bright ideas':'Your next cue'}</h3></div><div class="flex"><button class="small" data-do="tv">Open TV window</button><button class="small" data-action="CALL">${s.callLayout?'Standard layout':'Video-call layout'}</button><button class="small" data-do="fullscreen">Fullscreen</button></div></div>${s.screen==='wager'?wagerControls(s):`<p class="muted" style="margin-bottom:16px">${esc(hostScript(s))}</p>${settings(s).mode!=='paper'&&!s.revealed&&!['Closest Number','Final Wager'].includes(q.type)?`<div class="toolbar" style="margin:0 0 18px"><button class="primary" data-action="ARM" ${s.armed||s.buzz.length?'disabled':''}>Open ${settings(s).mode==='phone'?'big buttons':'keyboard buzzers'}</button><span class="muted">Hold-to-repeat is ignored. First press locks scoring; later presses show the order.</span></div>${settings(s).mode==='phone'?`<div class="pass-buttons">${active(s).map(t=>`<button data-buzz="${esc(t.id)}" style="border-color:${esc(t.color)}">${esc(t.name)}</button>`).join('')}</div>`:''}`:''}${q.type==='Closest Number'&&!s.revealed?numericControls(s):s.revealed?markControls(s):'<p class="muted">Run the timer, let teams talk, then reveal. Paper teams write their answers; the video team answers over the call.</p>'}`}
<div class="toolbar"><button class="small" data-do="back">← Previous question</button><button class="small" data-action="SKIP" ${s.revealed?'disabled':''}>Use spare / skip</button><button class="small" data-do="fix">Fix a score</button><button class="small" data-do="tie">Tie-breaker</button><button class="small" data-go="print">Printables</button><button class="small" data-do="export">Export backup</button></div></section>`;}
function numericControls(s){return `<div class="mark-grid">${active(s).map(t=>`<form class="mark-team number-form" data-team="${esc(t.id)}"><label for="guess-${esc(t.id)}">${esc(t.name)} — numeric guess</label><div class="flex"><input id="guess-${esc(t.id)}" type="number" step="any" name="guess" value="${esc(s.responses[t.id]??'')}" style="width:100px;flex:1" required><button class="small" type="submit">Save guess</button></div><small class="muted">${s.responses[t.id]!==undefined?'Saved: '+s.responses[t.id]:'Not saved yet'}</small></form>`).join('')}</div>`;}
function markControls(s){const q=question(s);return `<div class="mark-grid">${active(s).map(t=>{const done=s.marks[t.id]!==undefined,buzzer=['buzzer','phone'].includes(settings(s).mode)&&!['Closest Number','Final Wager'].includes(q.type)&&s.buzz[0]!==t.id;return `<div class="mark-team ${done?'done':''}" data-mark-team="${esc(t.id)}"><div class="team-name">${esc(t.name)} <span class="muted">${pointsText(t.score)}</span></div>${done?`<p>Marked · ${pointsText(Number(s.marks[t.id].toFixed(2)))}</p>`:q.type==='Order It'&&!buzzer?`<form class="order-form" data-team="${esc(t.id)}">${[0,1,2,3].map(i=>`<label class="sr-only" for="order-${esc(t.id)}-${i}">Position ${i+1} for ${esc(t.name)}</label><select id="order-${esc(t.id)}-${i}" name="order${i}"><option value="">Position ${i+1}…</option>${q.options.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`).join('')}<button type="submit" class="small primary" ${buzzer?'disabled':''}>Score order</button><button type="button" class="small" data-mark="${esc(t.id)}" data-right="false">No answer</button></form>`:`<div class="flex"><button class="primary" data-mark="${esc(t.id)}" data-right="true" ${buzzer?'disabled':''}>✓ Correct</button><button data-mark="${esc(t.id)}" data-right="false">✕ Incorrect</button></div>`}</div>`;}).join('')}</div>${['buzzer','phone'].includes(settings(s).mode)&&q.type!=='Final Wager'?'<div class="toolbar"><button data-action="PASS_REST">Mark unscored teams 0</button></div>':''}`;}
function wagerControls(s){const next=active(s).find(t=>!s.wagers[t.id]);return next?`<div class="wager-handoff card"><p class="eyebrow">PRIVATE HANDOFF</p><h2 style="margin:12px 0">${esc(next.name)}</h2><p class="muted">Ask other teams to look away. Only this team’s wager is shown here.</p><form id="wager-form" data-team="${esc(next.id)}"><label for="wager-value" style="margin-top:15px">Whole points, from 0 to ${Math.max(0,Math.floor(next.score))}</label><input id="wager-value" name="wager" type="number" min="0" max="${Math.max(0,Math.floor(next.score))}" step="1" required autocomplete="off"><button class="primary" type="submit">Seal wager & pass on</button></form></div>`:`<div class="wager-handoff card"><h2>All wagers are sealed.</h2><p class="muted" style="margin:15px 0">Bring everyone’s eyes back to the stage.</p><button class="primary" data-action="SHOW_FINAL">Show the final question ↗</button></div>`;}
const PRINTS=[['answers','Answer sheets','A numbered sheet for every team and round. Answers stay backstage.','▤'],['host','Host question book','The complete running order, correct answers and fact notes.','≡'],['scoreboard','Scoreboard sheet','A clear paper ledger for each round and team.','▥'],['cards','Team name cards','Big names for the tables. Cut, fold and gather.','Aa'],['recap','Night recap','Every round, every correction, every final score.','↗'],['certificate','Winner’s certificate','A proper keepsake for your bright-minded champions.','✦'],['poster','Invitation poster','The date, the venue and the prize. Invite your guests.','◇']];
function printables(){return `<main class="container"><div class="section-heading"><div><span class="eyebrow">THE PAPER DEPARTMENT</span><h1 style="font-size:44px;margin-top:10px">A little ink. A lot of occasion.</h1><p class="muted">Everything your tables need — and a keepsake for the winners.</p></div><div><label for="paper-size">Paper size</label><select id="paper-size"><option value="a4">A4</option><option value="letter" ${document.body.classList.contains('print-letter')?'selected':''}>US Letter</option></select></div></div><div class="print-grid">${PRINTS.map(([key,title,description,icon])=>`<section class="card print-tile"><div class="paper-icon" aria-hidden="true">${icon}</div><h3>${title}</h3><p>${description}</p><button data-print="${key}">Preview & print ↗</button></section>`).join('')}</div>${printKind?`<div class="toolbar"><button class="primary" data-do="print-now">Print / Save as PDF</button><button data-do="close-print">Close preview</button><span class="muted">Check your print dialog’s paper size. Enable background graphics for the poster.</span></div><div class="print-output" tabindex="-1" id="print-preview">${makePrint(printKind)}</div>`:''}</main>`;}
function printPage(body,classes=''){return `<section class="print-page ${classes}">${body}<div class="print-foot">${esc(E.state.show)} · ${CONFIG.credit.enabled?esc(E.state.host):'Quiz host'} · ${esc(E.state.event.date)} · ${esc(E.state.event.venue)}</div></section>`;}
function printSchedule(){return E.state.schedule.filter(q=>q.round<6).length?E.state.schedule.filter(q=>q.round<6):buildSchedule(E.state);}
function makePrint(kind){const s=E.state,qs=printSchedule(),teams=s.teams,rounds=s.rounds;switch(kind){case 'answers':return answerPages(s,qs);case 'host':return hostPages(s,qs);case 'scoreboard':return printPage(`<h2>Tonight’s score sheet</h2><p>${esc(s.pack)} edition · Corrections require a reason.</p><table style="margin-top:24px"><thead><tr><th>Team</th>${rounds.map((r,i)=>`<th>R${i+1}</th>`).join('')}<th>Fixes</th><th>Total</th></tr></thead><tbody>${teams.map(t=>`<tr><th>${esc(t.name)}</th>${rounds.map(()=>'<td style="height:48px"></td>').join('')}<td></td><td></td></tr>`).join('')}</tbody></table><h3>Corrections / tie-break</h3>${Array.from({length:5},()=>'<div class="rule"></div>').join('')}`);case 'cards':return teams.map(t=>printPage(`<p style="text-align:center">Fold at the dotted centre line · team table card</p><div class="team-card-print"><p style="font-size:30px">${esc(t.badge)}</p><h2>${esc(t.name)}</h2></div><hr style="border:0;border-top:2px dashed #7b938a"><div class="team-card-print" style="transform:rotate(180deg)"><p style="font-size:30px">${esc(t.badge)}</p><h2>${esc(t.name)}</h2></div>`)).join('');case 'recap':return printPage(`<h2>The night in bright ideas</h2><p>${esc(s.pack)} edition · ${esc(E.state.event.date)}</p><table style="margin-top:20px"><tr><th>Team</th>${rounds.map((r,i)=>`<th>R${i+1}</th>`).join('')}<th>Other*</th><th>Total</th></tr>${leaderboard(s).map(t=>`<tr><th>${esc(t.name)}${t.active?'':' (withdrawn)'}</th>${rounds.map((r,i)=>`<td>${fmt(s.ledger.filter(l=>l.team===t.id&&l.round===i&&l.kind!=='fix').reduce((n,l)=>n+l.points,0))}</td>`).join('')}<td>${fmt(s.ledger.filter(l=>l.team===t.id&&(l.kind==='fix'||l.round===6)).reduce((n,l)=>n+l.points,0))}</td><td><b>${fmt(t.score)}</b></td></tr>`).join('')}</table><p>*Manual corrections and tie-break points.</p><h3>Awards</h3>${awards(s).map(a=>`<p><b>${a.title}:</b> ${esc(a.name)}</p>`).join('')}<h3>Score corrections</h3>${s.ledger.filter(l=>l.kind==='fix').map(l=>`<p>${esc(s.teams.find(t=>t.id===l.team)?.name)}: ${fmt(l.points)} — ${esc(l.reason)}</p>`).join('')||'<p>No manual corrections.</p>'}<h3>With thanks</h3><p>Neighbours in the reading room and friends on the video call. ${CONFIG.credit.enabled?`Hosted by ${esc(E.state.host)}.`:''}</p>`);case 'certificate':{const top=leaderboard(s).filter(t=>t.active),wins=top.filter(t=>t.score===top[0]?.score);return wins.map(t=>printPage(`<p style="font-size:15px;letter-spacing:4px">A READING ROOM FULL OF STARS</p><h1 style="margin-top:22px">Certificate of<br>bright ideas</h1><p style="margin-top:25px">Awarded with a roomful of applause to</p><p class="award-name">${esc(t.name)}</p><p style="font-size:19px">${wins.length>1?'Joint champion':'Champion'} · ${pointsText(t.score)}</p><p style="margin:30px 0">${esc(E.state.show)}<br>${esc(E.state.event.date)}<br>${esc(E.state.event.venue)}, ${esc(E.state.event.town)}</p><p>Prize: ${esc(s.event.prize)}</p><p style="margin-top:30px">__________________________<br>${CONFIG.credit.enabled?esc(s.host):'Quiz host'} · Host</p>`,'certificate')).join('');}case 'poster':return printPage(`<p style="letter-spacing:3px;font-size:13px">${CONFIG.credit.enabled?esc(s.host.toUpperCase())+' INVITES YOU TO':'YOU ARE INVITED TO'}</p><h1 style="margin-top:35px">${esc(s.show.toUpperCase())}</h1><p>Big ideas.<br>Small-town sparkle.</p><div style="font-size:60px;color:#e0ffa4">✦</div><p>${esc(E.state.event.date)}<br><b>${esc(E.state.event.time)}</b></p><p>${esc(E.state.event.venue)}<br>${esc(E.state.event.room)} · ${esc(E.state.event.town)}</p><p>Friends, families & neighbours<br>Ages 10–80 · Teams of 3–6<br>About ${s.event.duration} minutes · ${esc(s.pack)} edition</p><p style="font-size:18px">Win ${esc(s.event.prize)}.<br>Faraway friends can join by video call.</p>`,'poster');default:return '';}}
function answerPages(s,qs){return s.teams.flatMap(t=>s.rounds.flatMap((r,ri)=>{const list=qs.filter(q=>q.round===ri),size=r.type==='Order It'?4:12,pages=[];for(let start=0;start<list.length;start+=size){const part=list.slice(start,start+size);pages.push(printPage(`<p style="font-size:11px;letter-spacing:2px">TEAM ANSWER SHEET · ROUND ${ri+1}${list.length>size?` · PAGE ${Math.floor(start/size)+1} OF ${Math.ceil(list.length/size)}`:''}</p><h2>${esc(t.name)}</h2><h3>${esc(r.type)}</h3><p>${r.type==='Order It'?'Write one item on each full-width line, in the requested order.':r.type==='Closest Number'?'One numeric estimate per question. Ties share the points.':r.type==='Final Wager'?'Keep your wager private. Use a whole number from 0 up to your score.':'Write one answer per question. This sheet never contains answers.'}</p>${r.type==='Final Wager'?'<div class="rule">Current score: __________ &nbsp; Wager: __________</div>':''}${part.map((q,j)=>`<div class="rule"><strong>${start+j+1}.</strong>${r.type==='Order It'?Array.from({length:4},(_,k)=>`<div class="order-write"><span>${k+1}.</span><span class="write-line"></span></div>`).join(''):r.type==='Odd One Out'?' □ A &nbsp; □ B &nbsp; □ C &nbsp; □ D &nbsp; Answer: ___________________________':' ______________________________________________________'}</div>`).join('')}<p style="margin-top:20px">Host marking: __________________ &nbsp; Round points: __________</p>`));}return pages;})).join('');}
function hostPages(s,qs){return s.rounds.flatMap((r,ri)=>{const list=qs.filter(q=>q.round===ri),pages=[];for(let start=0;start<list.length;start+=4){pages.push(printPage(`<p style="letter-spacing:2px">PRIVATE HOST BOOK · ${esc(s.pack)} EDITION</p><h2>Round ${ri+1}: ${esc(r.type)}</h2><p>${r.count} questions · ${pointsText(r.points)} · ${r.seconds} seconds · ${esc(r.mode)} · Page ${Math.floor(start/4)+1} of ${Math.ceil(list.length/4)}</p><ol start="${start+1}">${list.slice(start,start+4).map(q=>`<li><strong>${esc(q.prompt)}</strong>${q.picture?`<div class="host-picture">${pictureSVG(q.picture)}</div>`:''}${q.options.length?`<p>Options: ${q.options.map(esc).join(' / ')}</p>`:''}<p><b>Answer: ${esc(q.answer)}</b></p><p>${esc(q.note)}</p></li>`).join('')}</ol>`,'host-page'));}return pages;}).join('');}

function setPrint(kind){printKind=kind;$('#print-root').innerHTML=makePrint(kind);location.hash='print';render();$('#print-preview')?.focus({preventScroll:false});}
function openDialog(title,content){const d=$('#dialog');d.innerHTML=`<div class="dialog-top"><h2>${esc(title)}</h2><button class="small" data-do="dialog-close" aria-label="Close dialog">✕</button></div>${content}`;d.showModal();(d.querySelector('input,select,textarea')||d.querySelector('button[type=submit]')||d.querySelector('button'))?.focus();}
function teamDialog(id){const t=E.state.teams.find(t=>t.id===id)||{name:'',badge:'',color:'#dfff9f',players:''};openDialog(id?'Edit team':'Bring another team',`<form id="team-form" data-team="${esc(id||'')}"><div class="field"><label for="team-name">Team name</label><input id="team-name" name="name" maxlength="60" value="${esc(t.name)}" required></div><div class="form-grid"><div class="field"><label for="team-badge">Emoji or initials badge</label><input id="team-badge" name="badge" maxlength="12" value="${esc(t.badge)}"></div><div class="field"><label for="team-color">Team colour</label><input id="team-color" type="color" name="color" value="${esc(t.color)}"></div></div><div class="field"><label for="team-players">Player names (optional)</label><textarea id="team-players" name="players">${esc(t.players)}</textarea></div><div class="toolbar"><button type="submit" class="primary">Save team</button>${id&&t.active?`<button type="button" class="danger" data-withdraw="${esc(id)}">Withdraw team</button>`:''}${id?`<button type="button" data-down-team="${esc(id)}">Move down ↓</button>`:''}</div></form>`);}
function roundDialog(index){const r=E.state.rounds[index];openDialog('Round '+(index+1)+' · '+r.type,`<form id="round-form" data-index="${index}"><div class="form-grid"><div class="field"><label for="r-type">Round type</label><select id="r-type" name="type">${TYPES.map(t=>`<option ${t===r.type?'selected':''}>${t}</option>`).join('')}</select></div><div class="field"><label for="r-count">Questions</label><input id="r-count" name="count" type="number" min="1" max="30" value="${r.count}" required></div><div class="field"><label for="r-points">Points for a correct answer</label><input id="r-points" name="points" type="number" min="1" max="100" value="${r.points}" required></div><div class="field"><label for="r-seconds">Seconds per turn</label><input id="r-seconds" name="seconds" type="number" min="5" max="600" value="${r.seconds}" required></div><div class="field full"><label for="r-mode">Answer mode</label><select id="r-mode" name="mode"><option value="paper" ${r.mode==='paper'?'selected':''}>Paper sheets / host marking</option><option value="buzzer" ${r.type==='Final Wager'?'disabled':''} ${r.mode==='buzzer'?'selected':''}>One shared keyboard / buzzer</option><option value="phone" ${r.mode==='phone'?'selected':''}>Pass the phone / big buttons</option></select></div><label class="flex full"><input type="checkbox" name="partial" ${r.partial?'checked':''}> Order It: 1 point per correct position</label></div><div class="toolbar"><button type="submit" class="primary">Save round</button><button type="button" data-round-up="${index}" ${index===0?'disabled':''}>Move earlier ↑</button><button type="button" data-round-down="${index}" ${index===E.state.rounds.length-1?'disabled':''}>Move later ↓</button></div><p class="muted" style="font-size:13px;margin-top:15px">Final Wager uses sealed points instead of the points setting. Closest Number is collected as private numeric guesses in every answer mode.</p></form>`);}
function questionDialog(id){const q=E.state.bank.find(q=>q.id===id)||{id:'q-'+Date.now(),pack:E.state.pack,category:'General',difficulty:'Easy',type:'Lightning',prompt:'',answer:'',note:'',options:[],order:[],picture:'',source:''};openDialog('Question editor',`<form id="question-form" data-id="${esc(q.id)}"><div class="form-grid">${[['pack','Pack',['Christmas','New Year','Office Party','Classroom']],['difficulty','Difficulty',['Easy','Medium','Hard']],['type','Round type',TYPES]].map(([k,title,values])=>`<div class="field"><label for="q-${k}">${title}</label><select id="q-${k}" name="${k}">${values.map(v=>`<option ${q[k]===v?'selected':''}>${v}</option>`).join('')}</select></div>`).join('')}<div class="field"><label for="q-category">Category</label><input id="q-category" name="category" value="${esc(q.category)}" required></div><div class="field full"><label for="q-prompt">Question</label><textarea id="q-prompt" name="prompt" required>${esc(q.prompt)}</textarea></div><div class="field full"><label for="q-answer">Correct answer (number for Closest Number)</label><input id="q-answer" name="answer" value="${esc(q.answer)}" required></div><div class="field full"><label for="q-note">Fact note / Odd One Out reason</label><textarea id="q-note" name="note" required>${esc(q.note)}</textarea></div><div class="field full"><label for="q-options">Odd One Out / Order It: four options, one per line</label><textarea id="q-options" name="options">${esc(q.options.join('\n'))}</textarea></div><div class="field full"><label for="q-order">Order It: four correct-order items, one per line</label><textarea id="q-order" name="order">${esc(q.order.join('\n'))}</textarea></div><div class="field"><label for="q-picture">Picture: original SVG prop</label><select id="q-picture" name="picture"><option value="">None</option>${Object.keys(ART).map(k=>`<option ${q.picture===k?'selected':''}>${k}</option>`).join('')}</select></div><div class="field"><label for="q-source">Reference URL or derivation</label><input id="q-source" name="source" value="${esc(q.source)}"></div></div><button class="primary" type="submit">Validate & save question</button><p class="muted" style="font-size:12px;margin-top:12px">Imported cells are plain text. HTML, formulas and scripts are never executed. Duplicate prompts are rejected.</p></form>`);}
function fixDialog(){openDialog('Correct a score',`<form id="fix-form"><div class="field"><label for="fix-team">Team</label><select id="fix-team" name="teamId">${active(E.state).map(t=>`<option value="${esc(t.id)}">${esc(t.name)} · ${pointsText(t.score)}</option>`).join('')}</select></div><div class="field"><label for="fix-amount">Points to add (+) or subtract (−)</label><input id="fix-amount" name="amount" type="number" step="any" required></div><div class="field"><label for="fix-reason">Reason (saved in the recap)</label><input id="fix-reason" name="reason" required></div><button class="primary" type="submit">Log correction</button></form>`);}
function tieDialog(){openDialog('Call a tie-breaker',`<p class="muted">Select two or more active teams. A spare Closest Number question awards 1 point, shared equally by equally near teams. Another tie can use another spare.</p><form id="tie-form">${active(E.state).map(t=>`<label class="flex" style="margin:15px 0"><input type="checkbox" name="ids" value="${esc(t.id)}" ${t.score===Math.max(...active(E.state).map(x=>x.score))?'checked':''}> ${esc(t.name)} · ${fmt(t.score)}</label>`).join('')}<button class="primary" type="submit">Bring up the tie-breaker</button></form>`);}
function publicState(){const s=clone(E.state);s.bank=[];s.schedule=s.schedule.map((q,i)=>i===s.cursor?{...q,...(!s.revealed?{answer:'',note:'',order:[]}:{} )}:{id:q.id,type:q.type,round:q.round});if(!s.revealed)s.wagers=Object.fromEntries(Object.keys(s.wagers).map(k=>[k,{sealed:true}]));s.responses={};s.timer.remaining=remaining();return s;}
function syncTV(){if(isTV)return;const msg={kind:'TINT_STATE',channel,state:publicState()};try{if(tvWindow&&!tvWindow.closed)tvWindow.postMessage(msg,'*');bus?.postMessage(msg);}catch{}}
let tvSignature='';function receiveTV(state){const comparable=clone(state);comparable.timer.remaining=0;const signature=JSON.stringify(comparable);E.state=state;clockAt=performance.now();if(signature===tvSignature){if($('#clock'))$('#clock').textContent=clockText(state.timer.remaining);return;}tvSignature=signature;render();}
try{if('BroadcastChannel'in window){bus=new BroadcastChannel(channel);bus.onmessage=e=>{if(isTV&&e.data?.kind==='TINT_STATE'&&e.data.channel===channel){receiveTV(e.data.state);}};}}catch{}
window.addEventListener('message',e=>{if(isTV){if(e.source===window.opener&&e.data?.kind==='TINT_STATE'&&e.data.channel===channel){receiveTV(e.data.state);}}else if(e.data?.kind==='TINT_READY'&&e.data.channel===channel&&e.source!==window&&(!tvWindow||e.source===tvWindow)){tvWindow=e.source;syncTV();}});
function openTV(){const u=new URL(location.href);u.search='?tv='+encodeURIComponent(channel);u.hash='';tvWindow=window.open(u.href,'tinsel-tv-'+channel,'popup,width=1366,height=768');if(!tvWindow){toast('Allow this local file to open a second window, then try again.');return;}syncTV();toast('TV window opened. Move it to your display, then share that window only.');}
function render(){const oldRects=new Map([...document.querySelectorAll('[data-team-row]')].map(el=>[el.dataset.teamRow,el.getBoundingClientRect()]));const s=E.state;document.title=s.show+' · Quiz night';document.body.dataset.style=s.style;document.body.classList.toggle('tv-only',isTV||tourPresenter);document.body.classList.toggle('cover-mode',isCover);document.body.classList.toggle('tour-playing',tourActive);if(params.has('selftest'))return;if(isCover){app.innerHTML=stagePreview(true);return;}const route=location.hash.slice(1);app.innerHTML=isTV?showStage(s,true):header()+(route==='host'?hostStudio():route==='show'?showStage(E.state,tourPresenter):route==='print'?printables():welcome())+(!['show'].includes(route)?footer():'')+(tourActive?`<div class="tour-caption"><small>STUDIO TOUR · CLICK OR PRESS ANY KEY TO EXIT</small>${esc(tourCaption)}</div>`:'');fitStage();if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.querySelectorAll('[data-team-row]').forEach(el=>{const old=oldRects.get(el.dataset.teamRow);if(old){const d=old.top-el.getBoundingClientRect().top;if(d){el.dataset.animatedRank='true';el.animate([{transform:`translateY(${d}px)`},{transform:'none'}],{duration:600,easing:'cubic-bezier(.2,.8,.2,1)'});}}});}
function fitStage(){const stage=$('.show-stage'),content=$('.stage-content');if(!stage||!content)return;const tooTall=()=>content.scrollHeight>content.clientHeight+1;stage.classList.remove('compact','tight','micro');if(tooTall())stage.classList.add('compact');if(tooTall())stage.classList.add('tight');if(innerWidth<650&&tooTall()){stage.classList.add('micro');}}
window.addEventListener('resize',fitStage);
function closeDialog(){const d=$('#dialog');if(d.open)d.close();}

/* A timed, isolated demo. Real input cancels it before any normal UI handler. */
function tourMove(type,payload={}){const r=transition(E,{type,payload,elapsed:0});if(!r.ok)throw Error('Tour: '+r.error);E=r.session;clockAt=performance.now();}
function tourScene(type,{mode='paper',reveal=false,screen='question'}={}){E=createSession({...CONFIG,rounds:CONFIG.rounds.map(r=>({...r,count:1,seconds:45,mode:r.type===type?mode:'paper'}))});tourMove('START');E.state.teams.forEach((t,i)=>tourMove('FIX',{id:t.id,amount:[16,12,15,10,8,11][i],reason:'Isolated tour sample'}));while(question(E.state).type!==type){const q=question(E.state);if(q.type==='Closest Number')active(E.state).forEach((t,i)=>tourMove('GUESS',{id:t.id,value:q.answer+10+i}));tourMove('REVEAL');if(q.type!=='Closest Number')active(E.state).forEach(t=>tourMove('MARK',{id:t.id,right:false}));tourMove('NEXT');}if(type==='Closest Number'){const answer=question(E.state).answer;active(E.state).forEach((t,i)=>tourMove('GUESS',{id:t.id,value:answer+[-2,2,8,6,9,4][i]}));}if(reveal)tourMove('REVEAL');if(screen!=='question')tourMove('VIEW',{screen});location.hash='show';}

function tourFinale(){E=createSession({...CONFIG,rounds:CONFIG.rounds.map(r=>({...r,count:1,seconds:45,mode:r.type==='Lightning'?'buzzer':'paper'}))});tourMove('START');active(E.state).forEach((t,i)=>tourMove('FIX',{id:t.id,amount:[16,12,15,10,8,11][i],reason:'Isolated tour sample'}));tourMove('ARM');tourMove('BUZZ',{id:'t2'});tourMove('REVEAL');active(E.state).forEach(t=>tourMove('MARK',{id:t.id,right:t.id==='t2'}));tourMove('NEXT');tourMove('REVEAL');active(E.state).forEach(t=>tourMove('MARK',{id:t.id,right:t.id==='t0'}));tourMove('NEXT');for(let r=0;r<2;r++){tourMove('REVEAL');active(E.state).forEach(t=>tourMove('MARK',{id:t.id,right:false}));tourMove('NEXT');}const answer=question(E.state).answer;active(E.state).forEach((t,i)=>tourMove('GUESS',{id:t.id,value:answer+10+i}));tourMove('REVEAL');tourMove('NEXT');active(E.state).forEach((t,i)=>tourMove('WAGER',{id:t.id,value:[8,4,6,5,0,3][i]}));tourMove('SHOW_FINAL');tourMove('REVEAL');active(E.state).forEach((t,i)=>tourMove('MARK',{id:t.id,right:i%2===0}));location.hash='show';}

function stopTour(){if(!tourActive)return;tourActive=false;tourPresenter=false;isTour=false;clearTimeout(tourHandle);clearTimeout(toastHandle);held.clear();closeDialog();$('#toast').hidden=true;E=loadSaved();E.state=pausedState(E.state);clockAt=performance.now();const u=new URL(location.href);u.searchParams.delete('tour');u.hash='';history.replaceState(null,'',u.href);render();if(corruptRaw)toast('The damaged save was kept separately. New progress will save normally.');$('#start-show')?.focus({preventScroll:true});syncTV();}
function startTour(){tourActive=true;tourOriginal=createSession();const steps=[
 ['Welcome to a reading room transformed. Teams, near and far, share one sparkling night.',()=>{E=createSession();location.hash='';}],
 ['Backstage, gather your teams. A video-call team is already part of the room.',()=>{section='setup';location.hash='host';}],
 ['Shape the running order. Six original round types; every timer and point value is yours.',()=>{section='setup';location.hash='host';}],
 ['Lightning: one shared keyboard. The first press locks scoring; every later press stays visible.',()=>{tourScene('Lightning',{mode:'buzzer'});tourMove('ARM');tourMove('BUZZ',{id:'t2'});tourMove('BUZZ',{id:'t0'});tourMove('BUZZ',{id:'t4'});}],
 ['Look closely. Original vector pictures become a big, confident reveal.',()=>tourScene('Picture',{reveal:true})],
 ['Odd One Out: four clues, one outsider — and the reason behind the answer.',()=>tourScene('Odd One Out',{reveal:true})],
 ['Order It rewards careful thinking. Two correct positions earn two points in partial mode.',()=>{tourScene('Order It',{reveal:true});const q=question(E.state);tourMove('MARK',{id:'t0',right:false,order:[q.order[1],q.order[0],q.order[2],q.order[3]]});}],
 ['Closest Number: equally near teams share the points. Both names get their moment.',()=>tourScene('Closest Number',{reveal:true})],
 ['The scores rise, ranks slide and the leader catches a little gold.',()=>{tourScene('Lightning',{reveal:true});tourMove('MARK',{id:'t2',right:true});tourMove('VIEW',{screen:'scoreboard'});}],
 ['A mis-mark? Undo restores the points and pauses the clock. Redo is ready when you are.',()=>{tourScene('Lightning',{reveal:true});tourMove('MARK',{id:'t0',right:true});tourMove('UNDO');tourMove('VIEW',{screen:'scoreboard'});}],
 ['Presenter mode keeps the stage on the TV. Wagers and marking stay in the host window.',()=>{tourScene('Picture');E.state.callLayout=true;tourPresenter=true;}],
 ['The final wager is points only. Seal each choice privately, then reveal the last bright idea.',()=>{tourFinale();}],
 ['A roomful of stars: champions, a podium, and three original awards.',()=>{tourMove('NEXT');}],
 ['Print answer sheets, a host book, table cards, a recap and a proper winner’s certificate.',()=>{printKind=null;location.hash='print';}],
 ['Three atmospheres, one easy show. Tinsel Studio, Hearthside Pub and Midnight Countdown.',()=>{location.hash='';tourMove('STYLE',{style:'Hearthside Pub'});const swap=setTimeout(()=>{if(tourActive){tourMove('STYLE',{style:'Midnight Countdown'});render();}},2200);tourExtraTimers.push(swap);}]
];let index=0;function step(){if(!tourActive)return;if(index>=steps.length){stopTour();return;}tourPresenter=false;tourCaption=steps[index][0];steps[index][1]();index++;render();tourHandle=setTimeout(step,5000);}step();}
const tourExtraTimers=[];
function cancelTourInput(e){if(!tourActive||!e.isTrusted)return;e.preventDefault();e.stopImmediatePropagation();tourExtraTimers.forEach(clearTimeout);stopTour();}
document.addEventListener('click',cancelTourInput,true);document.addEventListener('keydown',cancelTourInput,true);
if(isTour)startTour();
</script><style>#demo-bar{position:relative;z-index:60;box-sizing:border-box;width:100%;background:#05141f;color:#f5f7ee;font:13.5px/1.5 'Quiz Reading',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:8px 16px;text-align:center;border-bottom:1px solid #37525c;overflow-wrap:anywhere}#demo-bar b{color:#ffe09b;font-weight:700}#demo-bar a{color:#dcffa0;font-weight:700;text-decoration:underline;text-underline-offset:2px;white-space:nowrap}#demo-bar a:hover{color:#ffe09b}#demo-bar a:focus-visible{outline:2px solid #dcffa0;outline-offset:2px;border-radius:3px}@media(max-width:540px){#demo-bar{font-size:12.5px;line-height:1.45;padding:7px 12px}}@media print{#demo-bar{display:none!important}}</style>
<script>/* Live demo bar (demo site only) */(function(){var q=new URLSearchParams(location.search);if(q.has('cover')||q.has('tv'))return;var d=document.createElement('div');d.id='demo-bar';d.setAttribute('role','note');d.innerHTML='<b>Live demo</b> · a sample quiz show built with our Codex prompt (fictional names; your entries stay in this browser). <a href="?tour=1">Play the 75-second tour</a> · <a href="https://promptbase.com/profile/trumpify?via=trumpify" target="_blank" rel="noopener">Get the prompt</a>';document.body.insertBefore(d,document.body.firstChild);window.addEventListener('click',function(e){if(e.target&&e.target.closest&&e.target.closest('#demo-bar a'))e.stopPropagation();},true);})();</script>
</body></html>
