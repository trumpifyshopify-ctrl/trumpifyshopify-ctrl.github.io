mber solstice, the Southern Hemisphere is tilted towards the Sun.","options":[],"order":[],"picture":"","source":"https://spaceplace.nasa.gov/seasons/en/"},{"id":"Q056","pack":"New Year","category":"New Year customs","difficulty":"Easy","type":"Lightning","prompt":"What gift is traditionally put inside Chinese Lunar New Year red envelopes?","answer":"Money","note":"Red envelopes containing money are a traditional Lunar New Year gift, especially for children.","options":[],"order":[],"picture":"","source":"https://lammuseum.wfu.edu/education/teachers/chinese-new-year/chinese-new-year-traditions/chinese-new-year-red-envelopes/"},{"id":"Q057","pack":"New Year","category":"Timekeeping","difficulty":"Easy","type":"Lightning","prompt":"What moving feature does a traditional sundial use to indicate the time?","answer":"A shadow","note":"A sundial’s pointer casts a shadow whose position changes as the Sun crosses the sky.","options":[],"order":[],"picture":"","source":"https://pwg.gsfc.nasa.gov/stargaze/Sundial.htm"},{"id":"Q058","pack":"New Year","category":"Visual clues","difficulty":"Easy","type":"Picture","prompt":"Which sand-filled timekeeper is shown?","answer":"Hourglass","note":"An hourglass measures an interval by sand flowing through a narrow opening.","options":[],"order":[],"picture":"hourglass","source":"Original inline SVG; https://science.nasa.gov/solar-system/comets/"},{"id":"Q059","pack":"New Year","category":"Visual clues","difficulty":"Easy","type":"Picture","prompt":"What outdoor timekeeper is pictured with a pointer and its shadow?","answer":"Sundial","note":"A sundial indicates local solar time from the position of a shadow.","options":[],"order":[],"picture":"sundial","source":"Original inline SVG; https://science.nasa.gov/solar-system/comets/"},{"id":"Q060","pack":"New Year","category":"Visual clues","difficulty":"Easy","type":"Picture","prompt":"Which swinging part hangs below the dial in this clock?","answer":"Pendulum","note":"A pendulum swings back and forth to regulate the motion of a pendulum clock.","options":[],"order":[],"picture":"pendulumclock","source":"Original inline SVG; https://science.nasa.gov/solar-system/comets/"},{"id":"Q061","pack":"New Year","category":"Visual clues","difficulty":"Easy","type":"Picture","prompt":"What icy Solar System object is shown with a bright tail?","answer":"Comet","note":"Sunlight heats a comet’s ice, releasing gas and dust that can form visible tails.","options":[],"order":[],"picture":"comet","source":"Original inline SVG; https://science.nasa.gov/solar-system/comets/"},{"id":"Q062","pack":"New Year","category":"Calendars","difficulty":"Hard","type":"Odd One Out","prompt":"Which of these Gregorian century years was a leap year?","answer":"1600","note":"Century years are leap years only when divisible by 400; 1600 qualifies, while the other three do not.","options":["1700","1900","1600","1800"],"order":[],"picture":"","source":"https://robinfo.oma.be/en/astro-info/calendar/the-gregorian-calendar/"},{"id":"Q063","pack":"New Year","category":"New Year customs","difficulty":"Medium","type":"Odd One Out","prompt":"Which animal is not one of the twelve animals of the traditional Chinese zodiac?","answer":"Eagle","note":"Rat, ox and dragon belong to the Chinese zodiac cycle; eagle does not.","options":["Dragon","Eagle","Ox","Rat"],"order":[],"picture":"","source":"https://lammuseum.wfu.edu/education/teachers/chinese-new-year/the-chinese-zodiac/"},{"id":"Q064","pack":"New Year","category":"Night sky","difficulty":"Medium","type":"Odd One Out","prompt":"Which of these planets is an ice giant rather than a rocky terrestrial planet?","answer":"Neptune","note":"Neptune is an ice giant; Mercury, Venus and Earth are terrestrial planets.","options":["Venus","Mercury","Neptune","Earth"],"order":[],"picture":"","source":"https://science.nasa.gov/solar-system/planets/"},{"id":"Q065","pack":"New Year","category":"Night sky","difficulty":"Easy","type":"Odd One Out","prompt":"Which object is a natural satellite rather than a star?","answer":"Moon","note":"The Moon orbits Earth; the Sun, Sirius and Polaris are stars.","options":["Polaris","Sun","Moon","Sirius"],"order":[],"picture":"","source":"https://science.nasa.gov/moon/"},{"id":"Q066","pack":"New Year","category":"Timekeeping","difficulty":"Easy","type":"Odd One Out","prompt":"Which device chiefly indicates direction rather than measuring time?","answer":"Compass","note":"A compass indicates direction; sundials, water clocks and hourglasses measure time.","options":["Water clock","Compass","Hourglass","Sundial"],"order":[],"picture":"","source":"https://www.nist.gov/pml/time-and-frequency-division/popular-links/walk-through-time/walk-through-time-early-clocks"},{"id":"Q067","pack":"New Year","category":"Timekeeping","difficulty":"Hard","type":"Order It","prompt":"Order these timekeeping milestones, earliest first.","answer":"Huygens’ pendulum clock → Harrison’s H4 completed → First quartz clock → First atomic clock demonstrated","note":"The milestones date to 1656, 1759, 1927 and the public atomic-clock demonstration in 1949.","options":["First quartz clock","Harrison’s H4 completed","First atomic clock demonstrated","Huygens’ pendulum clock"],"order":["Huygens’ pendulum clock","Harrison’s H4 completed","First quartz clock","First atomic clock demonstrated"],"picture":"","source":"https://brunelleschi.imss.fi.it/telescopiogalileo/etel.asp?c=36891 ; https://americanhistory.si.edu/collections/object/nmah_850827 ; https://tf.boulder.nist.gov/general/pdf/2907.pdf"},{"id":"Q068","pack":"New Year","category":"Historical firsts","difficulty":"Medium","type":"Order It","prompt":"Order these space milestones, earliest first.","answer":"First artificial Earth satellite → First human orbital flight → First crewed Moon landing → First rover operates on Mars","note":"Sputnik 1 launched in 1957; human orbital flight began in 1961; the Moon landing was 1969; the first Mars rover operated in 1997.","options":["First crewed Moon landing","First rover operates on Mars","First human orbital flight","First artificial Earth satellite"],"order":["First artificial Earth satellite","First human orbital flight","First crewed Moon landing","First rover operates on Mars"],"picture":"","source":"https://starchild.gsfc.nasa.gov/docs/StarChild/space_level2/travel.html ; https://science.nasa.gov/mission/mars-pathfinder/"},{"id":"Q069","pack":"New Year","category":"Night sky","difficulty":"Easy","type":"Order It","prompt":"Order these Moon phases through one cycle, beginning with new Moon.","answer":"New Moon → First quarter → Full Moon → Third quarter","note":"After new Moon come first quarter, full Moon and third quarter before the next new Moon.","options":["Full Moon","Third quarter","New Moon","First quarter"],"order":["New Moon","First quarter","Full Moon","Third quarter"],"picture":"","source":"https://science.nasa.gov/moon/moon-phases/"},{"id":"Q070","pack":"New Year","category":"Seasons","difficulty":"Medium","type":"Order It","prompt":"In the Northern Hemisphere, order these seasonal markers, starting with spring.","answer":"Spring equinox → Summer solstice → Autumn equinox → Winter solstice","note":"The sequence is the March equinox, June solstice, September equinox and December solstice.","options":["Winter solstice","Autumn equinox","Summer solstice","Spring equinox"],"order":["Spring equinox","Summer solstice","Autumn equinox","Winter solstice"],"picture":"","source":"https://aa.usno.navy.mil/faq/seasons_orbit.html"},{"id":"Q071","pack":"New Year","category":"Night sky","difficulty":"Medium","type":"Order It","prompt":"Order these planets by mean distance from the Sun, nearest first.","answer":"Earth → Mars → Jupiter → Saturn","note":"Earth is followed outward by Mars, Jupiter and Saturn in the Solar System.","options":["Jupiter","Earth","Saturn","Mars"],"order":["Earth","Mars","Jupiter","Saturn"],"picture":"","source":"https://science.nasa.gov/solar-system/planets/"},{ ,"options":[],"order":[],"picture":"","source":"https://science.nasa.gov/image-article/apod-1996-february-11-sputnik-the-traveling-companion/"},{"id":"Q077","pack":"New Year","category":"Calendars","difficulty":"Hard","type":"Closest Number","prompt":"In which year did Britain adopt the Gregorian calendar? Answer with a year.","answer":1752,"note":"In Britain, 2 September 1752 was followed by 14 September as the Gregorian calendar was adopted.","options":[],"order":[],"picture":"","source":"https://bl.iro.bl.uk/entities/publication/25914733-26b2-45cc-b4f0-bdb0c1e47b76"},{"id":"Q078","pack":"New Year","category":"Night sky","difficulty":"Hard","type":"Closest Number","prompt":"How many constellations had boundaries published by the IAU in 1930? Answer in constellations.","answer":88,"note":"The 1930 publication set out boundaries for 88 constellations, a list agreed in 1922.","options":[],"order":[],"picture":"","source":"https://www.iau.org/IAU/Astronomy-FAQs/Constellations.aspx"},{"id":"Q079","pack":"New Year","category":"Calendars","difficulty":"Hard","type":"Final Wager","prompt":"Farvardin is the first month of which calendar, whose New Year is Nowruz?","answer":"Solar Hijri (Persian) calendar","note":"Nowruz falls on the first day of Farvardin in the Persian Solar Hijri calendar.","options":[],"order":[],"picture":"","source":"https://www.iranicaonline.org/articles/nowruz-iii/"},{"id":"Q080","pack":"New Year","category":"Night sky","difficulty":"Hard","type":"Final Wager","prompt":"What is the name of the point in Earth’s orbit where it is closest to the Sun?","answer":"Perihelion","note":"Perihelion is the closest point to the Sun in an orbit; aphelion is the farthest.","options":[],"order":[],"picture":"","source":"https://aa.usno.navy.mil/faq/seasons_orbit.html"},{"id":"Q081","pack":"Office Party","category":"Places & people","difficulty":"Easy","type":"Lightning","prompt":"Which city is the national capital of Canada?","answer":"Ottawa","note":"Ottawa becam rchids/section-4-orchid-innovation-the-vanilla-orchid/"},{"id":"Q087","pack":"Office Party","category":"Food discoveries","difficulty":"Hard","type":"Lightning","prompt":"Which spice consists of the dried, unopened flower buds of a tree?","answer":"Cloves","note":"Cloves are unopened flower buds of Syzygium aromaticum, dried after picking.","options":[],"order":[],"picture":"","source":"https://www.kew.org/read-and-watch/christmas-spices"},{"id":"Q088","pack":"Office Party","category":"Everyday science","difficulty":"Medium","type":"Lightning","prompt":"Which weather instrument measures atmospheric pressure?","answer":"Barometer","note":"A barometer measures air pressure, helping observers track weather changes.","options":[],"order":[],"picture":"","source":"https://www.noaa.gov/jetstream/ll-pressure"},{"id":"Q089","pack":"Office Party","category":"Places & people","difficulty":"Easy","type":"Lightning","prompt":"Machu Picchu stands in which South American country?","answer":"Peru","note":"The Inca site of Machu Picchu lies in the Peruvian Andes.","options":[],"order":[],"picture":"","source":"https://whc.unesco.org/en/list/274/"},{"id":"Q090","pack":"Office Party","category":"Everyday science","difficulty":"Medium","type":"Lightning","prompt":"What rock family forms when molten rock cools and solidifies?","answer":"Igneous","note":"Igneous rocks form when magma or lava crystallises and solidifies.","options":[],"order":[],"picture":"","source":"https://www.usgs.gov/faqs/what-are-igneous-rocks?page=0"},{"id":"Q091","pack":"Office Party","category":"Outline adventures","difficulty":"Easy","type":"Picture","prompt":"Which Paris landmark is shown by this iron-lattice outline?","answer":"Eiffel Tower","note":"The Eiffel Tower was built in Paris for the 1889 Exposition Universelle.","options":[],"order":[],"picture":"eiffel","source":"https://www.toureiffel.paris/en/the-monument/universal-exhibition"},{"id":"Q092","pack":"Office Party","category":"Outline adventures","d antsciences.ucdavis.edu/gepts/plb143/CROP/MANGO/mango.htm"},{"id":"Q097","pack":"Office Party","category":"Places & people","difficulty":"Hard","type":"Odd One Out","prompt":"Which capital is the odd one out because it does not stand on the Danube?","answer":"Prague","note":"Vienna, Bratislava and Budapest stand on the Danube; Prague stands on the Vltava.","options":["Bratislava","Prague","Vienna","Budapest"],"order":[],"picture":"","source":"https://www.icpdr.org/danube-basin/danube-river-basin/danube-river-basin-overview-map ; https://www.npu.cz/en/heritage-conservation/the-heritage-fund/monuments-with-international-status/praha"},{"id":"Q098","pack":"Office Party","category":"Musical clues","difficulty":"Medium","type":"Odd One Out","prompt":"Which instrument is the odd one out because it belongs to the brass family?","answer":"Trombone","note":"Trombone is a brass instrument; flute, oboe and clarinet are woodwinds.","options":["Oboe","Flute","Trombone","Clarinet"],"order":[],"picture":"","source":"https://www.dallassymphony.org/community-education/dso-kids/listen-watch/instruments/"},{"id":"Q099","pack":"Office Party","category":"Nature surprises","difficulty":"Medium","type":"Odd One Out","prompt":"Which animal is the odd one out because it gives birth rather than laying eggs?","answer":"Kangaroo","note":"Kangaroos give birth; platypuses, echidnas and penguins lay eggs.","options":["Platypus","Penguin","Kangaroo","Echidna"],"order":[],"picture":"","source":"https://australian.museum/learn/animals/mammals/"},{"id":"Q100","pack":"Office Party","category":"Art & architecture","difficulty":"Medium","type":"Odd One Out","prompt":"Which landmark is the odd one out because it was not built by the ancient Romans?","answer":"Taj Mahal","note":"The Taj Mahal is a Mughal monument; the other three are ancient Roman structures.","options":["Colosseum","Pantheon in Rome","Taj Mahal","Pont du Gard"],"order":[],"picture":"","source":"https://whc.unesco.org/en/list/252/ ; https erfly’s life stages in their normal order, beginning with the egg.","answer":"Egg → Caterpillar → Chrysalis → Adult butterfly","note":"Complete butterfly metamorphosis proceeds through egg, larva, pupa and adult.","options":["Chrysalis","Egg","Adult butterfly","Caterpillar"],"order":["Egg","Caterpillar","Chrysalis","Adult butterfly"],"picture":"","source":"https://www.floridamuseum.ufl.edu/educators/resource/butterfly-life-cycle/"},{"id":"Q104","pack":"Office Party","category":"Deep time","difficulty":"Hard","type":"Order It","prompt":"Order these geological periods, earliest first.","answer":"Triassic → Jurassic → Cretaceous → Paleogene","note":"The Triassic, Jurassic and Cretaceous make up the Mesozoic; the Paleogene follows.","options":["Cretaceous","Triassic","Paleogene","Jurassic"],"order":["Triassic","Jurassic","Cretaceous","Paleogene"],"picture":"","source":"https://www.nps.gov/subjects/geology/time-scale.htm"},{"id":"Q105","pack":"Office Party","category":"Discoveries before 2000","difficulty":"Hard","type":"Order It","prompt":"Order these scientific milestones, earliest first.","answer":"Neptune recognised as a planet → X-rays discovered → Penicillin discovered → DNA double-helix model published","note":"These milestones date to 1846, 1895, 1928 and 1953, respectively.","options":["Penicillin discovered","Neptune recognised as a planet","DNA double-helix model published","X-rays discovered"],"order":["Neptune recognised as a planet","X-rays discovered","Penicillin discovered","DNA double-helix model published"],"picture":"","source":"https://ssd.jpl.nasa.gov/planets/discovery.html ; https://medicalmuseum.health.mil/index.cfm/visit/exhibits/virtual/xraydiscovery/index ; https://www.si.edu/object/alexander-flemings-penicillin-mold%3Anmah_472861 ; https://www.nature.com/articles/171737a0"},{"id":"Q106","pack":"Office Party","category":"Musical curiosities","difficulty":"Medium","type":"Closest Number","prompt":"How many keys does a standard modern piano have, black and white combined? Answer in keys.","answer":88,"note":"The standard modern piano keyboard contains 88 keys.","options":[],"order":[],"picture":"","source":"https://www.yamaha.com/en/musical_instrument_guide/piano/structure/structure003.html"},{"id":"Q107","pack":"Office Party","category":"Human body curiosities","difficulty":"Medium","type":"Closest Number","prompt":"In the standard anatomical count, how many bones are in an adult human skeleton? Answer in bones.","answer":206,"note":"The usual adult skeleton is described as having 206 named bones.","options":[],"order":[],"picture":"","source":"https://www.training.seer.cancer.gov/anatomy/skeletal/divisions/"},{"id":"Q108","pack":"Office Party","category":"Landmark dates","difficulty":"Hard","type":"Closest Number","prompt":"In which year did the Golden Gate Bridge first open to the public? Answer with a year.","answer":1937,"note":"The bridge opened to pedestrians on 27 May 1937.","options":[],"order":[],"picture":"","source":"https://www.goldengate.org/bridge/history-research/moments-events/key-dates/"},{"id":"Q109","pack":"Office Party","category":"Landmark dates","difficulty":"Hard","type":"Closest Number","prompt":"In which year was Sydney Opera House officially opened? Answer with a year.","answer":1973,"note":"Sydney Opera House was officially opened on 20 October 1973.","options":[],"order":[],"picture":"","source":"https://www.sydneyoperahouse.com/our-story/50-years-extraordinary-moments"},{"id":"Q110","pack":"Office Party","category":"Landmark details","difficulty":"Easy","type":"Closest Number","prompt":"How many rays project from the Statue of Liberty’s crown? Answer in rays.","answer":7,"note":"The Statue of Liberty’s crown has seven rays.","options":[],"order":[],"picture":"","source":"https://home.nps.gov/stli/learn/historyculture/statue-statistics.htm"},{"id":"Q111","pack":"Office Party","category":"Landmark details","difficulty":"Hard","type":"Closest Number","prompt":"How many columns surround the outside of the Lincoln Memorial? Answer in columns.","answer":36,"note":"Its 36 surrounding Doric columns represent the states at Lincoln’s death.","options":[],"order":[],"picture":"","source":"https://home.nps.gov/linc/learn/historyculture/exterior-features.htm"},{"id":"Q112","pack":"Office Party","category":"Human body curiosities","difficulty":"Medium","type":"Closest Number","prompt":"How many teeth form a complete adult set, including all four wisdom teeth? Answer in teeth.","answer":32,"note":"A complete permanent adult dentition, including wisdom teeth, contains 32 teeth.","options":[],"order":[],"picture":"","source":"https://www.hey.nhs.uk/patient-leaflet/removal-wisdom-teeth/"},{"id":"Q113","pack":"Office Party","category":"Landmark dates","difficulty":"Hard","type":"Closest Number","prompt":"In which year was the Suez Canal formally opened for navigation? Answer with a year.","answer":1869,"note":"The Suez Canal opened for navigation on 17 November 1869.","options":[],"order":[],"picture":"","source":"https://www.suezcanal.gov.eg/English/About/SuezCanal/Pages/CanalCharacteristics.aspx"},{"id":"Q114","pack":"Office Party","category":"Ancient clues","difficulty":"Hard","type":"Final Wager","prompt":"The Rosetta Stone carries Greek and Demotic writing. What is its third script?","answer":"Egyptian hieroglyphs","note":"The same decree appears in hieroglyphic, Demotic and Ancient Greek scripts.","options":[],"order":[],"picture":"","source":"https://www.britishmuseum.org/collection/image/16456004"},{"id":"Q115","pack":"Office Party","category":"Places & people","difficulty":"Hard","type":"Final Wager","prompt":"Which country has a Caspian Sea coast in its north and a Persian Gulf coast in its south?","answer":"Iran","note":"Iran has coasts on the Caspian Sea to the north and the Persian Gulf to the south.","options":[],"order":[],"picture":"","source":"https://visitiran.ir/en/overview"},{"id":"Q116","pack":"Classroom","category":"Earth science","difficulty":"Easy","type":"Lightning","prompt":"Which gas makes up most of Earth’s atmosphere?","answer":"Nitrogen","note":"About 78% of the air near Earth’s surface is nitrogen.","options":[],"order":[],"picture":"","source":"https://science.nasa.gov/earth/facts/"},{"id":"Q117","pack":"Classroom","category":"Ancient history","difficulty":"Easy","type":"Lightning","prompt":"What writing material did ancient Egyptians make from the stems of a Nile plant?","answer":"Papyrus","note":"Papyrus sheets were made from strips of the plant’s stem, laid in crossing layers.","options":[],"order":[],"picture":"","source":"https://www.britishmuseum.org/sites/default/files/2019-09/Presnotes_reading_a_papyrus_FINAL.pdf; https://www.ucl.ac.uk/museums-static/digitalegypt/craft/papyrus.html"},{"id":"Q118","pack":"Classroom","category":"Earth science","difficulty":"Medium","type":"Lightning","prompt":"What is the layer of Earth between its crust and core called?","answer":"Mantle","note":"The mantle is the thick rocky layer below the crust and above the core.","options":[],"order":[],"picture":"","source":"https://pubs.usgs.gov/gip/dynamic/inside.html"},{"id":"Q119","pack":"Classroom","category":"Human body","difficulty":"Medium","type":"Lightning","prompt":"Which organ produces bile to help digest fats?","answer":"Liver","note":"The liver makes bile; the gallbladder stores and releases it.","options":[],"order":[],"picture":"","source":"https://www.niddk.nih.gov/health-information/digestive-diseases/digestive-system-how-it-works"},{"id":"Q120","pack":"Classroom","category":"Cells and life","difficulty":"Medium","type":"Lightning","prompt":"What cell structure holds most DNA in a typical human body cell?","answer":"Nucleus","note":"Most human DNA is in the nucleus; a small amount is in mitochondria.","options":[],"order":[],"picture":"","source":"https://www.genome.gov/about-genomics/fact-sheets/Deoxyribonucleic-Acid-Fact-Sheet"},{"id":"Q121","pack":"Classroom","category":"Chemistry","difficulty":"Easy","type":"Lightning","prompt":"Which metal is liquid at 20°C: mercury or iron?","answer":"Mercury","note":"Mercury melts at about −39°C, so it is liquid at 20°C.","options":[],"order":[],"picture":"","source":"https://periodic-table.rsc.org/element/80/mercury"},{"id":"Q122","pack":"Classroom","category":"Words and origins","difficulty":"Hard","type":"Lightning","prompt":"The word “fossil” comes from a Latin word meaning what?","answer":"Dug up","note":"Latin fossilis means “dug up”; it originally described things taken from the ground.","options":[],"order":[],"picture":"","source":"https://australian.museum/learn/australia-over-time/fossils/how-do-fossils-form/"},{"id":"Q123","pack":"Classroom","category":"Animal wonders","difficulty":"Medium","type":"Lightning","prompt":"What in a flamingo’s diet gives its feathers their pink colour?","answer":"Carotenoid pigments","note":"Carotenoids from foods such as algae and small crustaceans colour flamingos’ feathers.","options":[],"order":[],"picture":"","source":"https://nationalzoo.si.edu/animals/news/why-are-flamingos-pink-and-other-flamingo-facts"},{"id":"Q124","pack":"Classroom","category":"Fossils and nature","difficulty":"Easy","type":"Lightning","prompt":"What golden fossilised tree resin can preserve ancient insects inside it?","answer":"Amber","note":"Sticky tree resin can trap insects and later harden into amber.","options":[],"order":[],"picture":"","source":"https://www.nps.gov/articles/000/preserved-remains.htm"},{"id":"Q125","pack":"Classroom","category":"Animal wonders","difficulty":"Easy","type":"Lightning","prompt":"Which mammals can sustain powered flight rather than merely glide?","answer":"Bats","note":"Bats fly by flapping their wings; flying squirrels and similar mammals glide.","options":[],"order":[],"picture":"","source":"https://home.nps.gov/subjects/bats/how-bats-fly.htm"},{"id":"Q126","pack":"Classroom","category":"Picture clues","difficulty":"Easy","type":"Picture","prompt":"Which eight-armed sea animal is pictured?","answer":"Octopus","note":"An octopus has eight arms; squid also have two longer feeding tentacles.","options":[],"order":[],"picture":"octopus","source":"https://ocean.si.edu/ocean-life/invertebrates/octopuses-squids-and-relatives"},{"id":"Q127","pack":"Classroom","category":"Picture clues","difficulty":"Easy","type":"Picture","prompt":"Which flightless seabird is shown in this silhouette?","answer":"Penguin","note":"Penguins are birds whose wings are adapted for swimming rather than flight.","options":[],"order":[],"picture":"penguin","source":"https://legacy.bas.ac.uk/about_antarctica/wildlife/birds/penguins/index.php"},{"id":"Q128","pack":"Classroom","category":"Picture clues","difficulty":"Easy","type":"Picture","prompt":"What erupting geological feature is shown?","answer":"Volcano","note":"Molten rock is called magma underground and lava after it reaches the surface.","options":[],"order":[],"picture":"volcano","source":"https://www.usgs.gov/programs/VHP/about-volcanoes"},{"id":"Q129","pack":"Classroom","category":"Picture clues","difficulty":"Medium","type":"Picture","prompt":"Which laboratory instrument is suggested by these lenses and specimen stage?","answer":"Microscope","note":"A light microscope uses lenses to make small objects appear larger.","options":[],"order":[],"picture":"microscope","source":"https://www.amnh.org/explore/ology/ology-cards/236-microscope"},{"id":"Q130","pack":"Classroom","category":"Picture clues","difficulty":"Easy","type":"Picture","prompt":"Which instrument is shown pointing towards the stars?","answer":"Telescope","note":"An optical telescope collects light with lenses or mirrors to reveal distant objects.","options":[],"order":[],"picture":"telescope","source":"https://spaceplace.nasa.gov/telescopes/en/"},{"id":"Q131","pack":"Classroom","category":"Animal families","difficulty":"Medium","type":"Odd One Out","prompt":"Which of these mammals lays eggs rather than giving birth to live young?","answer":"Platypus","note":"The platypus is an egg-laying monotreme; the other three give birth to live young.","options":["Tiger","Bat","Platypus","Dolphin"],"order":[],"picture":"","source":"https://australian.museum/learn/animals/mammals/mammals-mammalia/"},{"id":"Q132","pack":"Classroom","category":"Life in the sea","difficulty":"Easy","type":"Odd One Out","prompt":"Which is a fish rather than a marine mammal?","answer":"Shark","note":"Sharks breathe through gills; dolphins, seals and walruses are air-breathing mammals.","options":["Walrus","Shark","Seal","Dolphin"],"order":[],"picture":"","source":"https://www.fisheries.noaa.gov/national/outreach-and-education/fun-facts-about-shocking-sharks; https://www.noaa.gov/education/resource-collections/marine-life/marine-mammals"},{"id":"Q133","pack":"Classroom","category":"Rocks and minerals","difficulty":"Medium","type":"Odd One Out","prompt":"Which is a rock rather than a mineral?","answer":"Granite","note":"Granite is a rock made of minerals, commonly including quartz, feldspar and mica.","options":["Quartz","Feldspar","Granite","Mica"],"order":[],"picture":"","source":"https://www.usgs.gov/faqs/what-difference-between-a-rock-and-a-mineral"},{"id":"Q134","pack":"Classroom","category":"Human body","difficulty":"Hard","type":"Odd One Out","prompt":"Which is a sesamoid bone in a tendon, rather than a long bone?","answer":"Patella (kneecap)","note":"The patella develops in a tendon; the femur, tibia and humerus are long bones.","options":["Femur (thigh)","Tibia (shin)","Patella (kneecap)","Humerus (upper arm)"],"order":[],"picture":"","source":"https://openstax.org/books/anatomy-and-physiology-2e/pages/6-2-bone-classification"},{"id":"Q135","pack":"Classroom","category":"Planetary surprises","difficulty":"Hard","type":"Odd One Out","prompt":"Which planet spins in the opposite direction from the other three?","answer":"Venus","note":"Venus rotates retrograde, opposite to the rotation of Earth, Mars and Jupiter.","options":["Earth","Venus","Mars","Jupiter"],"order":[],"picture":"","source":"https://science.nasa.gov/venus/venus-facts/; https://nssdc.gsfc.nasa.gov/planetary/factsheet/"},{"id":"Q136","pack":"Classroom","category":"Space and scale","difficulty":"Medium","type":"Order It","prompt":"Order these planets by equatorial diameter, smallest first.","answer":"Mercury → Mars → Earth → Jupiter","note":"Their approximate diameters are 4,879 km, 6,792 km, 12,756 km and 142,984 km.","options":["Earth","Mercury","Jupiter","Mars"],"order":["Mercury","Mars","Earth","Jupiter"],"picture":"","source":"https://nssdc.gsfc.nasa.gov/planetary/factsheet/"},{"id":"Q137","pack":"Classroom","category":"Deep time","difficulty":"Hard","type":"Order It","prompt":"Order these geological periods from earliest to most recent.","answer":"Cambrian → Jurassic → Cretaceous → Quaternary","note":"The Cambrian came before the Jurassic, then the Cretaceous, then the Quaternary.","options":["Cretaceous","Cambrian","Quaternary","Jurassic"],"order":["Cambrian","Jurassic","Cretaceous","Quaternary"],"picture":"","source":"https://stratigraphy.org/chart/; https://www.bgs.ac.uk/discovering-geology/fossils-and-geological-time/geological-timechart/"},{"id":"Q138","pack":"Classroom","category":"History in order","difficulty":"Medium","type":"Order It","prompt":"Order these historical events, earliest first.","answer":"Great Fire of London → French Revolution begins → Wright Flyer’s first flight → Berlin Wall opens","note":"The events occurred in 1666, 1789, 1903 and 1989, respectively.","options":["Wright Flyer’s first flight","Great Fire of London","Berlin Wall opens","French Revolution begins"],"order":["Great Fire of London","French Revolution begins","Wright Flyer’s first flight","Berlin Wall opens"],"picture":"","source":"https://www.londonmuseum.org.uk/collections/london-stories/great-fire-of-london/; https://en.chateauversailles.fr/discover/history/key-dates; https://airandspace.si.edu/collection-objects/wright-1903-flyer/nasm_A19610048000; https://www.berlin.de/en/history/8482274-8619314-opening-and-fall-of-the-berlin-wall.en.html"},{"id":"Q139","pack":"Classroom","category":"Life cycles","difficulty":"Easy","type":"Order It","prompt":"Order these stages in a typical frog’s life, starting with the egg.","answer":"Egg → Tadpole → Froglet → Adult frog","note":"A frog develops from egg to tadpole, then a young froglet, then an adult.","options":["Froglet","Egg","Adult frog","Tadpole"],"order":["Egg","Tadpole","Froglet","Adult frog"],"picture":"","source":"https://australian.museum/learn/teachers/learning/frog-life-cycle/; https://www.nhm.ac.uk/discover/frogspawn-tadpoles-and-froglets.html"},{"id":"Q140","pack":"Classroom","category":"Human body","difficulty":"Hard","type":"Order It","prompt":"Starting at the right atrium, order this route of blood flow.","answer":"Right atrium → Right ventricle → Lungs → Left atrium","note":"Blood goes from the right atrium to right ventricle, then lungs, then left atrium.","options":["Lungs","Right atrium","Left atrium","Right ventricle"],"order":["Right atrium","Right ventricle","Lungs","Left atrium"],"picture":"","source":"https://www.nhlbi.nih.gov/health/heart/blood-flow"},{"id":"Q141","pack":"Classroom","category":"Museum stories","difficulty":"Hard","type":"Closest Number","prompt":"In which year was the Rosetta Stone first displayed at the British Museum?","answer":1802,"note":"The Rosetta Stone went on display at the British Museum in 1802.","options":[],"order":[],"picture":"","source":"https://github.com/BritishMuseumDH/rosettaStone/blob/master/README.md"},{"id":"Q142","pack":"Classroom","category":"History of science","difficulty":"Hard","type":"Closest Number","prompt":"In which year was the taxon name Dinosauria first published in a scientific report?","answer":1842,"note":"The report introducing Dinosauria was published in 1842, after the 1841 meeting.","options":[],"order":[],"picture":"","source":"https://www.nhm.ac.uk/discover/how-dinosaurs-got-their-name.html; https://www.lindahall.org/experience/digital-exhibitions/paper-dinosaurs/03-early-restorations/04-the-word-dinosaur-is-coined-1842/"},{"id":"Q143","pack":"Classroom","category":"Words and inventions","difficulty":"Hard","type":"Closest Number","prompt":"In which year was the six-dot braille code first published?","answer":1829,"note":"The original publication of the six-dot braille code appeared in Paris in 1829.","options":[],"order":[],"picture":"","source":"https://www.loc.gov/nls/services-and-resources/informational-publications/about-braille/"},{"id":"Q144","pack":"Classroom","category":"History of science","difficulty":"Medium","type":"Closest Number","prompt":"In which year did the World Health Assembly declare smallpox eradicated worldwide?","answer":1980,"note":"The World Health Assembly adopted the declaration on 8 May 1980.","options":[],"order":[],"picture":"","source":"https://www.who.int/publications/i/item/WHA33-3"},{"id":"Q145","pack":"Classroom","category":"Music and sound","difficulty":"Medium","type":"Closest Number","prompt":"How many strings does a standard full-size concert pedal harp have?","answer":47,"note":"A full-size concert pedal harp has 47 strings, with pedals used to alter their pitches.","options":[],"order":[],"picture":"","source":"https://philharmonia.co.uk/resources/instruments/harp/"},{"id":"Q146","pack":"Classroom","category":"Classic literature","difficulty":"Hard","type":"Closest Number","prompt":"How many books is the ancient Greek epic the Iliad divided into?","answer":24,"note":"The Iliad is conventionally divided into 24 books.","options":[],"order":[],"picture":"","source":"https://classics.mit.edu/Homer/iliad.html; https://www.perseus.tufts.edu/hopper/text?doc=Perseus%3Atext%3A1999.01.0134%3Abook%3D24"},{"id":"Q147","pack":"Classroom","category":"Classic literature","difficulty":"Hard","type":"Closest Number","prompt":"How many cantos are in the complete Divine Comedy, including its opening canto?","answer":100,"note":"Its three parts contain 34, 33 and 33 cantos, giving 100 in the complete poem.","options":[],"order":[],"picture":"","source":"https://www.museocasadidante.it/en/dante-alighieri/the-divine-comedy/; https://ahc.leeds.ac.uk/discover-dante/doc/introducing-dante/page/12"},{"id":"Q148","pack":"Classroom","category":"Animal wonders","difficulty":"Medium","type":"Closest Number","prompt":"How many permanent teeth are in a typical adult cat’s complete dentition?","answer":30,"note":"Cats normally develop 30 permanent teeth, replacing their 26 baby teeth.","options":[],"order":[],"picture":"","source":"https://www.vet.cornell.edu/departments-centers-and-institutes/cornell-feline-health-center/health-information/feline-health-topics/when-kitty-needs-dentist"},{"id":"Q149","pack":"Classroom","category":"Space vocabulary","difficulty":"Hard","type":"Final Wager","prompt":"What astronomical term names the boundary between day and night on Earth?","answer":"Terminator","note":"The day–night boundary on a planet is called its terminator.","options":[],"order":[],"picture":"","source":"https://www.nasa.gov/image-article/night-and-earth-day/; https://sos.noaa.gov/catalog/datasets/daynight-terminator-daily/"},{"id":"Q150","pack":"Classroom","category":"Human body","difficulty":"Hard","type":"Final Wager","prompt":"What is the anatomical name of the stirrup-shaped bone in the middle ear?","answer":"Stapes","note":"The stapes is the stirrup; the other middle-ear bones are the malleus and incus.","options":[],"order":[],"picture":"","source":"https://my.clevelandclinic.org/health/body/ossicles; https://www.nidcd.nih.gov/health/how-do-we-hear"}], // Full editable bank: 150 English questions with fact notes and sources.

const active=s=>s.teams.filter(t=>t.active&&(!s.tieIds||s.tieIds.includes(t.id)));
const leaderboard=s=>[...s.teams].sort((a,b)=>b.score-a.score||s.teams.indexOf(a)-s.teams.indexOf(b));

function createSession(config=CONFIG){return {base:initial(config),state:initial(config),past:[],future:[],actions:[]};}
function pausedState(s){const x=clone(s);x.timer.running=false;x.armed=false;return x;}
// All mutations, including undo and redo, pass through this function.
const PREFERENCES=['style','muted','callLayout'];
function transition(session,a){try{validateAction(a);const e={...session,past:[...session.past],future:[...session.future],actions:[...session.actions,clone(a)]};const prefs=Object.fromEntries(PREFERENCES.map(k=>[k,session.state[k]]));if(a.type==='UNDO'){need(e.past.length,'Nothing to undo.');const h=e.past.pop();e.future.push(h);e.state={...pausedState(h.before),...prefs};}else if(a.type==='REDO'){need(e.future.length,'Nothing to redo.');const h=e.future.pop();e.past.push(h);e.state={...pausedState(h.after),...prefs};}else{const before=clone(e.state);if(before.timer.running&&a.elapsed)before.timer.remaining=Math.max(0,before.timer.remaining-a.elapsed);e.state=reduceState(e.state,a);if(!['MUTE','STYLE','CALL','RESTORE'].includes(a.type)){e.past.push({before,after:clone(e.state),action:clone(a)});e.future=[];}}return {ok:true,session:e};}catch(error){return {ok:false,error:error.message};}}
function replay(base,actions){validateBase(base);need(Array.isArray(actions)&&actions.length<=20000,'A backup can contain at most 20,000 actions.');let e={base:clone(base),state:clone(base),past:[],future:[],actions:[]};for(const a of actions){const r=transition(e,a);need(r.ok,'Replay: '+r.error);e=r.session;}return e;}
function validateBank(bank){need(Array.isArray(bank)&&bank.length>0&&bank.length<=3000,'Import 1–3000 questions.');const ids=new Set,seen=new Set;for(const q of bank){objectFields(q,['id','pack','category','difficulty','type','prompt','answer','note','options','order','picture','source'],'Question');idValue(q.id);need(!ids.has(q.id),'Question IDs must be unique.');ids.add(q.id);textValue(q.prompt,'Question prompt',220);const k=q.prompt.trim().toLowerCase().replace(/\s+/g,' ');need(!seen.has(k),'Duplicate question: '+q.prompt);seen.add(k);need(TYPES.includes(q.type)&&['Christmas','New Year','Office Party','Classroom'].includes(q.pack),'Unknown pack or question type.');need(['Easy','Medium','Hard'].includes(q.difficulty),'Use Easy, Medium or Hard difficulty.');textValue(q.note,'Fact note',400);textValue(q.category,'Category',80);textValue(q.source,'Source',1200,true);need(Array.isArray(q.options)&&Array.isArray(q.order),'Options and order must be lists.');need(q.options.length<=4&&q.order.length<=4,'Use at most four options or ordered items.');[...q.options,...q.order].forEach(x=>textValue(x,'Answer option',100));textValue(q.picture,'Picture ID',60,true);need(q.picture===''||own(ART,q.picture),'Use a built-in picture ID; imported SVG, styles and image code are not accepted.');if(q.type==='Closest Number')need(typeof q.answer==='number'&&Number.isFinite(q.answer),'Numeric questions need a finite numeric answer.');else textValue(q.answer,'Correct answer',420);const fold=x=>x.trim().toLowerCase();if(q.type==='Odd One Out')need(q.options.length===4&&new Set(q.options.map(fold)).size===4&&q.options.filter(x=>x===q.answer).length===1,'Odd One Out needs four distinct options and one correct option.');if(q.type==='Order It')need(q.order.length===4&&q.options.length===4&&new Set(q.order.map(fold)).size===4&&new Set(q.options.map(fold)).size===4&&q.options.every(x=>q.order.includes(x))&&q.answer===q.order.join(' → '),'Order It needs four distinct options, each appearing once in const CSV_FIELDS=['id','pack','category','difficulty','type','prompt','answer','note','options','order','picture','source'];
function csvSafe(v){return /^[=+\-@]/.test(v)||v.startsWith("'")||/^\s+[=+\-@]/.test(v)?"'"+v:v;}
function csvRaw(v){return v.startsWith("'")&&(v[1]==="'"||/^\s*[=+\-@]/.test(v.slice(1)))?v.slice(1):v;}
function exportCSV(bank){return [CSV_FIELDS,...bank.map(q=>CSV_FIELDS.map(k=>['options','order'].includes(k)?JSON.stringify(q[k]||[]):String(q[k]??'')))].map(row=>row.map(v=>'"'+csvSafe(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');}
function parseCSV(text){const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else if(quoted)quoted=false;else{need(cell==='','Unexpected quote in CSV.');quoted=true;}}else if(c===','&&!quoted){row.push(cell);cell='';}else if((c==='\r'||c==='\n')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}else cell+=c;}need(!quoted,'CSV has an unclosed quote.');if(cell||row.length){row.push(cell);rows.push(row);}need(rows.length>1&&JSON.stringify(rows[0])===JSON.stringify(CSV_FIELDS),'Use the exported CSV column headings.');const bank=rows.slice(1).filter(r=>r.some(x=>x)).map(r=>{need(r.length===CSV_FIELDS.length,'A CSV row has the wrong number of cells.');r=r.map(csvRaw);const q={};CSV_FIELDS.forEach((k,i)=>q[k]=['options','order'].includes(k)?JSON.parse(r[i]||'[]'):k==='answer'&&r[4]==='Closest Number'?Number(r[i]):r[i]);return q;});validateBank(bank);return bank;}

const own=(o,k)=>Object.prototype.hasOwnProperty.call(o,k);
function objectFields(o,allowed,label){need(o&&typeof o==='object'&&!Array.isArray(o),`${label} must be an object.`);for(const k of Object.keys(o))need(!['__proto__','prototype','constructor'].includes(k)&&allowed.includes(k),`${label} contains an unsupported field: ${k}.`);}
function textValue(v,label,max=300,blank=false){need(typeof v==='string'&&v.length<=max&&(blank||v.trim().length>0),`${label} must be ${blank?'text':'nonempty text'} of at most ${max} characters.`);}
function idValue(v){need(typeof v==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(v)&&!['__proto__','constructor','prototype'].includes(v),'Use a valid built-in or saved ID.');}
function whole(v,min,max,label){need(Number.isInteger(v)&&v>=min&&v<=max,`${label} must be a whole number from ${min} to ${max}.`);}
function numeric(v,label='Value'){need((typeof v==='number'||typeof v==='string')&&String(v).trim()!==''&&/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(String(v).trim())&&Number.isFinite(Number(v))&&Math.abs(Number(v))<=1e12,`${label} must be a finite number; it cannot be blank.`);return Number(v);}
function colorValue(v){need(typeof v==='string'&&/^#[0-9a-f]{6}$/i.test(v),'Team colours must use #rrggbb, for example #a1c5e8.');}
function validateRound(r){objectFields(r,['type','count','points','seconds','mode','partial','minutes'],'Round');need(TYPES.includes(r.type),'Choose a known round type.');whole(r.count,1,30,'Question count');whole(r.points,1,100,'Points');whole(r.seconds,5,600,'Timer seconds');need(['paper','buzzer','phone'].includes(r.mode),'Choose paper, buzzer or pass-the-phone mode.');need(r.type!=='Final Wager'||r.mode!=='buzzer','Final Wager cannot use buzzer mode; every team must answer.');need(typeof r.partial==='boolean','Partial scoring must be on or off.');if(r.minutes!==undefined)whole(r.minutes,0,600,'Round minutes');return true;}
function validateTeam(t,base=false){objectFields(t,base?['id','name','color','badge','players','score','active','key']:['id','name','color','badge','players'],'Team');idValue(t.id);textValue(t.name,'Team name',60);colorValue(t.color);textValue(t.badge,'Team badge',12,true);textValue(t.players,'Player names',300,true);if(base){need(t.score===0&&t.active===true,'Backup setup teams must begin active with zero points.');need(KEYS.includes(t.key),'Team keyboard key is invalid.');}}
function validateBase(b){const template=initial();objectFields(b,Object.keys(template),'Quiz setup');textValue(b.show,'Show name',100);textValue(b.host,'Host name',100);need(own(CONFIG.styles,b.style),'Choose a known style.');need(['Christmas','New Year','Office Party','Classroom'].includes(b.pack),'Choose a known question pack.');objectFields(b.event,['date','time','town','venue','room','duration','prize'],'Event');for(const k of ['date','time','town','venue','room','prize'])textValue(b.event[k],'Event '+k,180);whole(b.event.duration,1,600,'Event duration');need(Array.isArray(b.teams)&&b.teams.length>=2&&b.teams.length<=8,'A setup needs 2–8 teams.');b.teams.forEach(t=>validateTeam(t,true));need(new Set(b.teams.map(t=>t.id)).size===b.teams.length&&new Set(b.teams.map(t=>t.key)).size===b.teams.length,'Team IDs and keys must be unique.');need(Array.isArray(b.rounds)&&b.rounds.length>=1&&b.rounds.length<=12,'A setup needs 1–12 rounds.');b.rounds.forEach(validateRound);validateBank(b.bank);for(const k of ['schedule','ledger','used','buzz','firstBuzz'])need(Array.isArray(b[k])&&b[k].length===0,'Backup setup must be fresh; progress belongs in its recorded actions.');for(const k of ['responses','wagers','marks']){objectFields(b[k],[],k);}need(b.cursor===-1&&b.screen==='welcome'&&b.revealed===false&&b.armed===false&&b.paused===false&&b.tieIds===null&&b.tieReturn===null,'Backup setup has invalid show progress.');objectFields(b.timer,['remaining','running'],'Timer');need(b.timer.remaining===0&&b.timer.running===false,'Backup setup timer must start at zero and paused.');need(typeof b.muted==='boolean'&&typeof b.callLayout==='boolean','Backup preferences must be on or off.');need(b.version===1,'Backup state version is unsupported.');textValue(b.notice,'Notice',600,true);if(b.mainLength!==undefined)need(b.mainLength===0,'Backup setup cannot contain a running schedule.');if(b.jointAccepted!==undefined)need(b.jointAccepted===false,'Backup setup cannot contain a result.');return tr const ACTION_FIELDS={START:[],VIEW:['screen'],NEXT:[],BACK:[],REVEAL:[],MARK:['id','right','order'],PASS_REST:[],GUESS:['id','value'],WAGER:['id','value'],SHOW_FINAL:[],ARM:[],BUZZ:['id'],TIMER:[],TIMEOUT:[],PAUSE:[],FIX:['id','amount','reason'],WITHDRAW:['id'],TEAM:['id','newId','name','badge','color','players'],REORDER_TEAM:['id','direction'],ROUND:['index','round'],ROUND_MOVE:['index','direction'],PACK:['pack'],RESTORE:['remaining'],STYLE:['style'],CALL:[],MUTE:[],BANK:['bank'],SKIP:[],TIE:['ids'],UNDO:[],REDO:[],ACCEPT_JOINT:[]};
function validateAction(a){objectFields(a,['type','payload','elapsed'],'Action');need(typeof a.type==='string'&&own(ACTION_FIELDS,a.type),'This action type is not supported.');const p=a.payload||{};objectFields(p,ACTION_FIELDS[a.type],'Action '+a.type);if(a.elapsed!==undefined)need(typeof a.elapsed==='number'&&Number.isFinite(a.elapsed)&&a.elapsed>=0&&a.elapsed<=1e9,'Elapsed time must be a valid nonnegative number.');if(p.id!==undefined)idValue(p.id);if(p.newId!==undefined)idValue(p.newId);if(['GUESS','WAGER'].includes(a.type))numeric(p.value,a.type==='WAGER'?'Wager':'Guess');if(a.type==='MARK'){need(typeof p.right==='boolean','Mark the answer correct or incorrect.');if(p.order!==undefined){need(Array.isArray(p.order)&&p.order.length===4,'Submit four ordered items.');p.order.forEach(x=>textValue(x,'Order item',100));}}

if(a.type==='TEAM'){textValue(p.name,'Team name',60);textValue(p.badge,'Team badge',12,true);textValue(p.players,'Player names',300,true);colorValue(p.color);}
