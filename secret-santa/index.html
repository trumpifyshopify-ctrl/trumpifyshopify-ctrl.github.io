 if(!valid())return;

 if(state.draw){const yes=await confirmBox('Make a new draw?','Everyone will receive a new envelope and code. Previous Party files and links still contain the old draw. Tell the group to discard them.','Re-draw');if(!valid()||!yes)return}

function qrSVG(text){try{let q;for(let n=1;n<=20;n++){try{q=new QRLibrary.QR(n,QRLibrary.L);q.addData(text);q.make();break}catch(e){q=null}}if(!q)throw Error('Link is too long for a QR code. Shorten the hosted address.');const n=q.getModuleCount();let d='';for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.isDark(y,x))d+=`M${x+4} ${y+4}h1v1h-1z`;return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${n+8} ${n+8}" role="img" aria-label="Private envelope QR code" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="white"/><path d="${d}" fill="black"/></svg>`}catch(e){return `<span>${esc(e.message)}</span>`}}

function render(){document.body.dataset.style=cfg().style;document.title=cfg().appName+' · Secret Santa';if(coverMode){$('#app').innerHTML=`<div class="cover">${art(cfg().eventName)}</div>`;return}$('#app').innerHTML=`<div class="snow"></div>${!cryptoOK?'<div class="no-crypto" role="alert">Web Crypto is unavailable. Opening envelopes and drawing need a modern browser on file:// or HTTPS. You can still write a wishlist.</div>':''}<div class="wrap">${header()}<main id="main">${({welcome,studio,join:joinView,reveal:revealView,wish:wishView}[view]||welcome)()}</main>${footer()}</div>`;bindForms();const active=$('.tabs .active');if(active){const strip=active.parentElement;strip.scrollLeft=Math.max(0,active.offsetLeft-strip.offsetLeft-(strip.clientWidth-active.offsetWidth)/2)}if(view==='studio'&&tab==='pass')preparePass();}

function toast(m){$('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.role='status';e.textContent=m;document.body.append(e);visualCleanupLater(()=>e.remove(),3600)}
function showError(m){const target=$('#draw-error')||$('#reveal-error');if(target)target.innerHTML=`<div class="notice error" role="alert">${esc(m)}</div>`;else toast(m)}
let previousFocus;
function modal(html,onBind){previousFocus=document.activeElement;const el=document.createElement('div');el.className='modal-backdrop';el.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${html}</div>`;document.body.append(el);const focusable=()=>[...el.querySelectorAll('button,input,textarea,select,a[href]')];focusable()[0]?.focus();el.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();el.querySelector('[data-modal-cancel]')?.click()}if(e.key==='Tab'){const a=focusable(),f=a[0],l=a[a.length-1];if(e.shiftKey&&document.activeElement===f){e.preventDefault();l.focus()}else if(!e.shiftKey&&document.activeElement===l){e.preventDefault();f.focus()}}});onBind?.(el);return el}
function closeModal(e){e.remove();previousFocus?.focus()}
function confirmBox(title,body,label='Continue'){return new Promise(resolve=>modal(`<h2 id="modal-title">${esc(title)}</h2><p>${esc(body)}</p><div class="actions"><button data-modal-cancel>Cancel</button><button class="primary" data-confirm>${esc(label)}</button></div>`,el=>{el.querySelector('[data-modal-cancel]').onclick=()=>{closeModal(el);resolve(false)};el.querySelector('[data-confirm]').onclick=()=>{closeModal(el);resolve(true)}}))}
function infoBox(title,body){modal(`<h2 id="modal-title">${esc(title)}</h2>${body}<div class="actions"><button data-modal-cancel class="primary">Close</button></div>`,el=>el.querySelector('[data-modal-cancel]').onclick=()=>closeModal(el))}

function download(name,text,type='application/json'){const u=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),2000)}
function shareMessage(p){const code=state.draw.codes[p.id],link=secretLink(p)||'Open the Party index.html file sent by your organizer.';return cfg().messageTemplate.replace(/\{(name|link|code)\}/g,(_match,key)=>({name:p.name,link,code})[key])}
async function exportParty(returnOnly=false){if(state.draw)await sealAll();const config={...clone(cfg()),edition:'party',participants:clone(state.participants),wishlists:{},questions:[],exclusions:[],households:[]};const draw=state.draw?{salt:state.draw.salt,envelopes:state.draw.envelopes,time:state.draw.time,fingerprint:state.draw.fingerprint,peeked:state.draw.peeked}:null;const seed={draw,publicWishes:cfg().wishlistVisibility==='group'?state.wishlists:{}};const safe=v=>JSON.stringify(v,null,2).replace(/</g,'\\u003c');let html=TEMPLATE.replace(/\/\* CONFIG_START[\s\S]*?\/\* CONFIG_END \*\//,()=> '/* CONFIG_START */\nconst CONFIG = '+safe(config)+';\n/* CONFIG_END */');html=html.replace(/(<script id="party-data" type="application\/json">)[\s\S]*?(<\/script>)/,(_match,open,close)=>open+safe(seed)+close);if(returnOnly)return html;download('index.html',html,'text/html');toast(state.draw?'Party edition exported. Send codes privately.':'Invitation exported. Re-export after the draw.');}
function readDraft(){const f=$('#wish-form');if(!f)return;const d=new FormData(f);wishDraft={...wishDraft,items:wishDraft.items.map((i,n)=>({name:String(d.get('item-name-'+n)||'').trim(),link:String(d.get('item-link-'+n)||'').trim(),detail:String(d.get('item-detail-'+n)||'').trim(),price:String(d.get('item-price-'+n)||'').trim()})),no:String(d.get('no')||''),about:String(d.get('about')||'')};}

function saveWish(){readDraft();if(!isParty){state.wishlists[wishOwner]=clone(wishDraft);save()}else if(!transient){try{localStorage.setItem('velvet-post.wish.'+CONFIG.id+'.'+wishOwner,JSON.stringify(wishDraft))}catch(e){toast('Please copy a slip; device storage is unavailable.')}}}
function cleanWish(w){if(!w||typeof w!=='object')throw Error('This wishlist is missing its contents.');const str=(v,n)=>String(v??'').slice(0,n);return {items:(Array.isArray(w.items)?w.items:[]).slice(0,8).filter(i=>i&&str(i.name,120).trim()).map(i=>({name:str(i.name,120),link:safeLink(str(i.link,500)),detail:str(i.detail,140),price:str(i.price,30)})),no:str(w.no,240),about:str(w.about,500),answers:Array.isArray(w.answers)?w.answers.slice(0,20).map(a=>({question:str(a.question,300),answer:str(a.answer,500)})):[]}}
function fileSlip(kind,d){if(d.event!==cfg().id)throw Error('This slip is for a different exchange.');const p=person(d.person||d.to);if(!p)throw Error('No matching participant. Ask the sender for a slip from this invitation.');if(kind==='WISH'){const old=state.wishlists[p.id];state.wishlists[p.id]=cleanWish(d.wishlist);if(old?.answers)state.wishlists[p.id].answers=old.answers;return 'Wishlist filed for '+p.name}if(kind==='QUESTION'){if(!d.question?.trim())throw Error('The question is empty.');if(!state.questions.some(q=>q.id===d.id))state.questions.push({id:String(d.id||'q'+Date.now()),to:p.id,name:p.name,question:String(d.question).slice(0,300),answer:''});return 'Question filed for '+p.name}if(kind==='ANSWER'){const q=state.questions.find(q=>q.id===d.id&&q.to===p.id);if(!q)throw Error('Import the question slip before its answer.');applyAnswer(q,String(d.answer||'').slice(0,500));return 'Answer filed for '+p.name}throw Error('Unknown slip type.')}
function parseSlips(text){const found=[...text.matchAll(/SANTA-(WISH|QUESTION|ANSWER):([A-Za-z0-9+/=]+)/g)];if(!found.length)throw Error('No slips found. Paste the complete SANTA-WISH: or SANTA-QUESTION: text.');const results=[];for(const [,kind,payload]of found){try{results.push(fileSlip(kind,JSON.parse(new TextDecoder().decode(unb64(payload)))))}catch(e){results.push('Not filed: '+e.message)}}save();return results}
function applyAnswer(q,answer){if(!answer.trim())throw Error('Add a short answer first.');q.answer=answer;const w=state.wishlists[q.to]||(state.wishlists[q.to]={items:[],no:'',about:''});w.answers=(w.answers||[]).filter(a=>a.id!==q.id);w.answers.push({id:q.id,question:q.question,answer});save()}
async function preparePass(valid=()=>true){

 try{const r=await decrypt(p.id,s.draw.codes[p.id]);if(!valid()||state!==s)return;if(view==='studio'&&tab==='pass'&&p.id===s.participants[passIndex%s.participants.length].id)passValue=r}catch(e){if(valid()&&state===s)toast(e.message)}
}

function chime(kind){if(muted)return;try{const C=window.AudioContext||window.webkitAudioContext;const ctx=window._audio||(window._audio=new C());ctx.resume();[523.25,659.25,783.99].forEach((f,i)=>{const o=ctx.createOscillator(),g=ctx.createGain(),t=ctx.currentTime+i*.085;o.type='sine';o.frequency.value=kind==='seal'?f*.65:f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.035,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.55);o.connect(g);g.connect(ctx.destination);o.start(t);o.stop(t+.6)})}catch(e){muted=true}}

// All tour timers, animation frames and asynchronous continuations belong to a run.
// Cancelling invalidates the run BEFORE restoring real data; late crypto results are discarded.
let tourRun=0;
const tourSleeps=new Set(),tourFrames=new Set();
function tourCurrent(token){return tourActive&&token===tourRun}
function visualCleanupLater(fn,ms){if(tourActive){const token=tourRun;tourLater(ms,()=>{if(tourCurrent(token))fn()},'',token)}else setTimeout(fn,ms)}
function tourSleep(ms,token){return new Promise(resolve=>{if(!tourCurrent(token))return resolve(false);const job={id:null,resolve};job.id=setTimeout(()=>{tourSleeps.delete(job);resolve(tourCurrent(token))},ms);tourSleeps.add(job)})}
function clearTourWork(){timers.forEach(clearTimeout);timers=[];for(const job of tourSleeps){clearTimeout(job.id);job.resolve(false)}tourSleeps.clear();tourFrames.forEach(cancelAnimationFrame);tourFrames.clear()}
function tourFrame(token,fn){if(!tourCurrent(token))return;const id=requestAnimationFrame(()=>{tourFrames.delete(id);if(tourCurrent(token))fn()});tourFrames.add(id)}
function tourLater(ms,fn,caption,token=tourRun){
 if(!tourCurrent(token))return;
 const id=setTimeout(async()=>{timers=timers.filter(t=>t!==id);if(!tourCurrent(token))return;
  try{await fn(token,()=>tourCurrent(token));if(!tourCurrent(token))return;if(caption)setCaption(caption,token)}catch(e){if(tourCurrent(token))toast(e.message)}
 },ms);timers.push(id);
}
